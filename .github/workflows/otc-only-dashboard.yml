name: Make dashboard OTC only

on:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - '.github/workflows/otc-only-dashboard.yml'

permissions:
  contents: write

jobs:
  otc-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep only simulated OTC markets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')

          otc = "const assets={BTCOTC:{name:'BTC/USD OTC',icon:'₿',otc:true,symbol:'BTCUSD-OTC',digits:2},ETHOTC:{name:'ETH/USD OTC',icon:'Ξ',otc:true,symbol:'ETHUSD-OTC',digits:2},XAUOTC:{name:'XAU/USD OTC',icon:'Au',otc:true,symbol:'XAUUSD-OTC',digits:2},EUROTC:{name:'EUR/USD OTC',icon:'€',otc:true,symbol:'EURUSD-OTC',digits:5},JPYOTC:{name:'JPY/USD OTC',icon:'¥',otc:true,symbol:'JPYUSD-OTC',digits:6},CHFOTC:{name:'CHF/USD OTC',icon:'₣',otc:true,symbol:'CHFUSD-OTC',digits:5},GBPOTC:{name:'GBP/USD OTC',icon:'£',otc:true,symbol:'GBPUSD-OTC',digits:5},AUDOTC:{name:'AUD/USD OTC',icon:'A$',otc:true,symbol:'AUDUSD-OTC',digits:5}};let selected='BTCOTC'"
          s2, n = re.subn(r"const assets=\{.*?\};let selected='[^']+'", otc, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('assets block not found')
          s = s2

          # Remove the old rescue script that could fall back to Coinbase BTC.
          s2, n = re.subn(r"<script>\s*\(function\(\)\{.*?\}\)\(\);\s*</script></body>", "</script></body>", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('rescue script not found')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit OTC-only dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          if git diff --cached --quiet; then
            echo 'No dashboard changes needed.'
          else
            git commit -m 'Make dashboard OTC only'
            git push
          fi
