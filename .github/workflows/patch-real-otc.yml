name: Patch Real + OTC market feeds
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch market feeds
        run: python3 .github/scripts/patch_market_feed.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js dashboard.html
          git diff --cached --quiet || git commit -m 'Add real market proxy and simulated OTC markets'
          git push