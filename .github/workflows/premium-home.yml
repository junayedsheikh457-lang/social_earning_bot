name: Premium Homepage

on:
  push:
    branches: [main]

jobs:
  premium:
    if: ${{ !contains(github.event.head_commit.message, '[premium-home-auto]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enhance homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')
          s = p.read_text(encoding='utf-8')
          if 'data-fe-premium-home="1"' in s:
              raise SystemExit(0)
          style = r'''<style data-fe-premium-home="1">
:root{--fe-bg:#07111f;--fe-panel:#0e1c30;--fe-line:#263b59;--fe-text:#f5f8ff;--fe-muted:#9aacc5;--fe-accent:#6d7cff;--fe-green:#25e39a}
html{scroll-behavior:smooth}
body{background:radial-gradient(900px 520px at 80% -10%,#263a78 0%,transparent 60%),radial-gradient(700px 420px at 5% 20%,#123c49 0%,transparent 62%),var(--fe-bg)!important;color:var(--fe-text)!important}
body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,#000,transparent 70%);z-index:-1}
header,nav,.navbar,.topbar{background:rgba(7,17,31,.78)!important;border-color:rgba(130,153,197,.22)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero h1,.hero h2,section:first-of-type h1{letter-spacing:-1.8px;text-shadow:0 8px 35px #0008}
.hero h1 strong,.hero h1 span,section:first-of-type h1 strong{background:linear-gradient(100deg,#fff 10%,#a9b6ff 48%,#25e39a 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
button,a.btn,.btn,.cta{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease!important}
button:hover,a.btn:hover,.btn:hover,.cta:hover{transform:translateY(-2px);box-shadow:0 12px 32px #0005}
.card,.pricing-card,.feature-card,.stat,.panel,.box{background:linear-gradient(145deg,rgba(20,37,62,.94),rgba(8,20,35,.94))!important;border:1px solid rgba(126,151,202,.24)!important;box-shadow:0 18px 55px #0003,inset 0 1px #ffffff0a!important;border-radius:20px!important}
.card:hover,.pricing-card:hover,.feature-card:hover{border-color:#6d7cff99!important;transform:translateY(-4px);transition:.25s ease}
.btn-primary,.primary,.cta-primary,.hero a[href*="challenge"]{background:linear-gradient(135deg,#7180ff,#5365e8)!important;color:#fff!important;border:1px solid #9aa6ff66!important;box-shadow:0 10px 30px #5365e844!important}
.btn-secondary,.secondary{background:#ffffff08!important;border:1px solid #8b9bc733!important;color:#e8eeff!important}
.badge,.pill,.tag{background:#7180ff20!important;border:1px solid #8c9aff55!important;color:#bfc7ff!important;border-radius:999px!important}
input,select,textarea{background:#081526!important;color:#fff!important;border:1px solid #354b6b!important;border-radius:12px!important}
footer{background:#050c17!important;border-top:1px solid #263b59!important}
@media(max-width:700px){.hero h1,section:first-of-type h1{font-size:clamp(34px,10vw,52px)!important;line-height:1.06!important;letter-spacing:-1.3px!important}.card,.pricing-card,.feature-card,.stat,.panel,.box{border-radius:16px!important}}
</style>'''
          s = s.replace('</head>', style + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit premium homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply premium homepage style [premium-home-auto]'
          git push
