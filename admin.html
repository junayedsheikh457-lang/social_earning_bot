<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FundedEdge — Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#082d69;font-family:Inter,system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.box,.order{background:#fff;border:1px solid #dfe6ef;border-radius:20px;padding:20px;box-shadow:0 15px 40px #082d6910;margin-bottom:16px}.logo{font-size:25px;font-weight:950}.logo span{color:#3157d7}input{padding:13px;border:1px solid #d9e1eb;border-radius:10px;width:100%;margin:10px 0}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:900;cursor:pointer}.load{background:#3157d7;color:#fff}.approve{background:#15966a;color:#fff}.reject{background:#d95265;color:#fff;margin-left:7px}.muted{color:#7b8ca5;font-size:13px;line-height:1.5}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:6px 9px;border-radius:99px;background:#fff5df;color:#866626;font-size:10px;font-weight:900}.ok{background:#eaf8f1;color:#176b49}@media(max-width:600px){.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="box"><div class="row"><div><div class="logo">Funded<span>Edge</span> Admin</div><p class="muted">Payment verification and simulated account issuance.</p></div><a href="index.html">Website</a></div><input id="key" type="password" placeholder="Admin key"><button class="btn load" onclick="loadOrders()">Load pending orders</button><div id="msg" class="muted"></div></div><section id="list"></section></main><script>const API='https://fundededge-api.onrender.com';let key='';async function loadOrders(){key=document.getElementById('key').value;const msg=document.getElementById('msg');try{const r=await fetch(API+'/api/admin/orders',{headers:{'x-admin-key':key}});const d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('list').innerHTML=d.orders.map(o=>`<article class="order"><div class="row"><div><b>#${o.id} · ${o.name}</b><div class="muted">${o.email} · ${o.mode} · $${Number(o.size/1000).toFixed(0)}K · $${o.price}</div><div class="muted">Payment ref: ${o.payment_ref||'Not supplied'}</div></div><span class="pill ${o.status==='approved'?'ok':''}">${o.status.toUpperCase()}</span></div>${o.status==='pending'?`<div style="margin-top:14px"><button class="btn approve" onclick="act(${o.id},'approve')">Approve & issue account</button><button class="btn reject" onclick="act(${o.id},'reject')">Reject</button></div>`:''}</article>`).join('')||'<div class="box">No orders yet.</div>'}catch(e){msg.textContent=e.message}}async function act(id,type){const r=await fetch(API+'/api/admin/orders/'+id+'/'+type,{method:'POST',headers:{'x-admin-key':key,'Content-Type':'application/json'}});const d=await r.json();alert(d.ok?'Done: '+(d.account?.account_no||'updated'):(d.error||'Failed'));loadOrders()}</script></body></html>
