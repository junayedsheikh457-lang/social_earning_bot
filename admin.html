<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fashion Mart Admin</title><link rel="stylesheet" href="style.css"><style>main{max-width:900px;margin:35px auto;padding:0 18px}.panel{padding:22px;border:1px solid var(--line)}label{display:block;margin:12px 0}input,select{width:100%;padding:10px;border:1px solid var(--line)}.warning{background:#fff2df;padding:12px;font-size:12px;line-height:1.7}.item{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}</style></head><body><div class="top">FASHION MART · ADMIN PANEL</div><main><p class="warning">এই প্যানেলটি শুধু এই ব্রাউজারে localStorage-এ পণ্য রাখে। এটি নিরাপদ লগইন বা সার্ভার ডেটাবেস নয়; লাইভ ব্যবসার আগে সুরক্ষিত ব্যাকএন্ড দরকার।</p><section class="panel"><h1>পণ্য যোগ করুন</h1><form id="f"><label>পণ্যের নাম<input name="name" required></label><label>ক্যাটাগরি<select name="category"><option>থ্রি-পিস</option><option>বোরখা</option><option>কুর্তি</option><option>হিজাব</option></select></label><label>দাম (৳)<input name="price" type="number" min="0" required></label><label>রঙ<input name="color" value="#bd6388"></label><button class="btn">সেভ করুন</button></form></section><section class="panel"><h2>পণ্যের তালিকা</h2><div id="list"></div></section><a href="index.html">← দোকানে ফিরে যান</a></main><script>let p=[];try{p=JSON.parse(localStorage.getItem('fm_products'))||[]}catch{}const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function render(){document.getElementById('list').innerHTML=p.map(x=>'<div class="item">'+esc(x.name)+' · ৳'+x.price+' <button onclick="del('+x.id+')">মুছুন</button></div>').join('')||'হোমপেজের ডেমো পণ্য তালিকায় এখনো নেই'}window.del=id=>{p=p.filter(x=>x.id!==id);localStorage.setItem('fm_products',JSON.stringify(p));render()};document.getElementById('f').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));p.unshift({id:Date.now(),name:d.name,category:d.category,price:Number(d.price),color:d.color});localStorage.setItem('fm_products',JSON.stringify(p));render();e.target.reset()};render();</script></body></html>
