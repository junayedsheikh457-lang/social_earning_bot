<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3157d7"><title>FundedEdge — Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#dce9ff,transparent 35%),#f5f8fd;color:#082d69;font-family:Inter,system-ui,Arial}.box{width:min(440px,calc(100% - 28px));background:#fff;border:1px solid #dfe6ef;border-radius:28px;padding:30px;box-shadow:0 30px 80px #082d6918}.logo{font-size:27px;font-weight:950;letter-spacing:-1px}.logo span{color:#3157d7}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#edf1f6;padding:5px;border-radius:13px;margin:25px 0}.tabs button{border:0;background:transparent;padding:12px;border-radius:10px;font-weight:900;color:#6f809a}.tabs button.active{background:#fff;color:#3157d7;box-shadow:0 5px 15px #082d6910}label{display:block;font-size:11px;font-weight:900;color:#71829e;margin:13px 0 6px}input{width:100%;padding:14px;border:1px solid #d9e1eb;border-radius:12px;font-size:15px;outline:none}input:focus{border-color:#3157d7}.primary{width:100%;border:0;background:#3157d7;color:#fff;padding:15px;border-radius:12px;font-weight:950;font-size:15px;margin-top:18px}.msg{min-height:20px;color:#d34d5d;font-size:12px;margin-top:12px}.note{font-size:11px;color:#8291a8;line-height:1.5;margin-top:18px;text-align:center}.home{display:block;text-align:center;color:#3157d7;text-decoration:none;font-size:12px;font-weight:900;margin-top:18px}</style></head><body><main class="box"><div class="logo">Funded<span>Edge</span></div><p style="color:#7b8ca5">Secure access to your simulated trading workspace.</p><div class="tabs"><button class="active" id="lt">Login</button><button id="rt">Create account</button></div><form id="form"><div id="nameWrap" style="display:none"><label>FULL NAME</label><input id="name" autocomplete="name"></div><label>EMAIL</label><input id="email" type="email" autocomplete="email" required><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="primary" id="submit">Login to Dashboard</button><div class="msg" id="msg"></div></form><div class="note">FundedEdge trading is a simulated evaluation environment. No real-money binary trade is executed from this interface.</div><a class="home" href="index.html">← Back to website</a></main><script>const API='https://fundededge-api.onrender.com';let register=false;const $=x=>document.getElementById(x);function setMode(v){register=v;$('lt').classList.toggle('active',!v);$('rt').classList.toggle('active',v);$('nameWrap').style.display=v?'block':'none';$('submit').textContent=v?'Create secure account':'Login to Dashboard';$('msg').textContent=''}$('lt').onclick=()=>setMode(false);$('rt').onclick=()=>setMode(true);$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='';try{const r=await fetch(API+'/api/auth/'+(register?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');localStorage.setItem('fe_token',d.token);location.href='dashboard.html'}catch(err){$('msg').textContent=err.message}$('submit').disabled=false}</script></body></html>
