<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অর্ডার | Fashion Mart</title><link rel="stylesheet" href="style.css"><style>.form{max-width:650px;margin:40px auto;padding:22px;border:1px solid var(--line)}label{display:block;margin:14px 0}input,textarea{width:100%;padding:12px;border:1px solid var(--line);font:inherit}.notice{font-size:12px;color:#8b6d7b;line-height:1.7}</style></head><body><div class="top">FASHION MART · CHECKOUT</div><main class="form"><h1>ডেলিভারি তথ্য</h1><form id="f"><label>আপনার নাম *<input name="name" required></label><label>মোবাইল নম্বর *<input name="phone" required inputmode="tel"></label><label>সম্পূর্ণ ঠিকানা *<textarea name="address" required rows="3"></textarea></label><label>জেলা *<input name="district" required></label><button class="btn">অর্ডার তৈরি করুন</button></form><p class="notice">সতর্কতা: এই সংস্করণে সার্ভার/ডেটাবেস সংযুক্ত নয়। অর্ডার তৈরি হলেও তা স্বয়ংক্রিয়ভাবে দোকানদারের কাছে যাবে না।</p><a href="index.html">← শপিংয়ে ফিরে যান</a></main><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();let c=JSON.parse(localStorage.getItem('fm_cart')||'[]');if(!c.length)return alert('কার্ট খালি');let d=Object.fromEntries(new FormData(e.target));let o={ref:'FM'+Date.now().toString().slice(-8),customer:d,cart:c,date:new Date().toISOString()};localStorage.setItem('fm_last_order',JSON.stringify(o));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download=o.ref+'.json';a.click();alert('ডেমো অর্ডার ফাইল তৈরি হয়েছে; সার্ভারে পাঠানো হয়নি।')}</script></body></html>
