<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FundedEdge — Trading</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#171c2b;--panel:#202638;--panel2:#252c40;--line:#343c50;--text:#f4f7fb;--muted:#8d96aa;--blue:#2589ee;--green:#0fbd69;--red:#ed4c43;--gold:#ff9f1c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.top{height:64px;flex:0 0 64px;background:#1d2333;border-bottom:1px solid #2d3548;display:flex;align-items:center;gap:9px;padding:0 10px;z-index:30}.logo{width:39px;height:39px;border-radius:11px;background:linear-gradient(145deg,#6b7cf4,#4456cf);display:grid;place-items:center;font-size:21px;font-weight:1000}.brand{font-size:18px;font-weight:950}.brand span{color:#8d9bff}.account{margin-left:auto;display:flex;gap:7px;align-items:center}.balance{height:42px;min-width:112px;padding:0 9px;border:1px solid #3d4962;border-radius:9px;background:#293247;display:flex;align-items:center;gap:7px;font-weight:950}.balance b{font-size:9px;color:#ffab16;background:#30384a;padding:5px 6px;border-radius:6px}.balance span{font-size:13px}.bell{height:42px;width:42px;border:1px solid #3d4962;border-radius:9px;background:#293247;color:#fff;font-size:19px;position:relative}.badge{position:absolute;right:-4px;top:-5px;min-width:18px;height:18px;border-radius:10px;background:#e94755;font-size:10px;display:grid;place-items:center}.deposit{height:42px;border:0;border-radius:9px;padding:0 15px;background:#16c978;color:#062117;font-weight:1000}
.layout{flex:1;min-height:0;display:flex;position:relative;overflow:auto;flex-direction:column}.market{min-width:0;min-height:430px;flex:0 0 430px;display:flex;flex-direction:column}.charthead{height:43px;flex:0 0 43px;display:flex;align-items:center;padding:0 10px;background:#171d2c;border-bottom:1px solid #30384b}.marketinfo{display:flex;align-items:center;gap:6px}.pair{font-size:15px;font-weight:950}.live{font-size:9px;color:#92a3ff;background:#293456;padding:4px 6px;border-radius:5px;font-weight:950}.quote{margin-left:auto;font-size:16px;font-weight:950}.toolbar{height:39px;flex:0 0 39px;display:flex;align-items:center;gap:2px;padding:2px 7px;background:#1b2131;border-bottom:1px solid #30384b;overflow:auto;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}.tool{height:32px;min-width:31px;padding:0 7px;border:0;border-radius:6px;background:transparent;color:#9da7b9;font-size:16px}.tool.active{background:#30394d;color:#fff}.tf{font-size:10px;font-weight:950}.chartbox{position:relative;flex:1;min-height:360px;overflow:hidden}.chart{position:absolute;inset:0}.label{position:absolute;left:10px;top:9px;color:#9ba5b7;font-size:10px;z-index:3;pointer-events:none}.priceTag{position:absolute;right:8px;top:48%;background:#248bf0;border-radius:14px;padding:6px 9px;font-size:12px;font-weight:1000;z-index:4;pointer-events:none}.trade-line{position:absolute;left:0;right:0;top:48%;border-top:1px dashed #eef3ff66;display:none;z-index:3;pointer-events:none}.trade-line span{position:absolute;right:174px;top:-13px;background:#343c50;padding:4px 7px;border-radius:4px;font-size:10px}.vline{position:absolute;top:0;bottom:0;left:58%;border-left:1px dashed #eef3ff77;display:none;z-index:3;pointer-events:none}.marker-text{position:absolute;top:10px;left:28%;right:28%;display:flex;justify-content:space-between;color:#9aa3b3;font-size:11px;opacity:.8;z-index:3;pointer-events:none}.status{height:24px;flex:0 0 24px;display:flex;align-items:center;padding:0 9px;color:#8994a8;background:#171d2c;border-top:1px solid #30384b;font-size:9px}.dot{width:6px;height:6px;border-radius:50%;background:#17cf7b;margin-right:5px}.side{width:350px;flex:0 0 350px;background:#202638;border-left:1px solid #30384b;padding:12px;overflow:auto}.assetbar{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin-bottom:9px}.assetbar::-webkit-scrollbar{display:none}.asset{white-space:nowrap;border:1px solid #3a455b;background:#293247;color:#aeb7c8;border-radius:7px;height:34px;padding:0 9px;font-size:10px;font-weight:900}.asset.active{background:#354572;color:#fff;border-color:#7188e8}.controlTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.assetName{font-size:15px;font-weight:1000}.payout{color:var(--gold);font-size:16px;font-weight:1000}.pending{display:flex;align-items:center;gap:7px;color:#8d97aa;font-size:10px}.switch{width:39px;height:21px;border-radius:12px;background:#2c364b;border:1px solid #48536a;padding:2px}.switch i{display:block;width:15px;height:15px;border-radius:50%;background:#248bf0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;color:#8993a8;font-size:10px;margin:0 0 5px}.inputbox{height:55px;border:1px solid #505b70;background:#252c3e;border-radius:8px;display:flex;align-items:center;padding:0 10px}.inputbox input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:17px;font-weight:950}.inputbox select{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:15px;font-weight:900}.inputbox select option{background:#202638;color:#fff}.stepper{display:flex;align-items:center;justify-content:space-between;width:100%}.step{width:34px;height:34px;border:0;border-radius:50%;background:#30384b;color:#d8deea;font-size:20px}.stepper strong{font-size:17px}.switchText{text-align:center;color:#268af1;font-weight:1000;font-size:10px;margin:5px 0 7px}.payoutrow{display:flex;justify-content:space-between;border-bottom:1px dotted #475065;padding:5px 0 7px;color:#8993a8;font-size:11px}.payoutrow b{font-size:15px;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.actions button{height:57px;border:0;border-radius:7px;color:#fff;font-size:18px;font-weight:1000;display:flex;align-items:center;justify-content:space-between;padding:0 13px}.up{background:#0dbb67}.down{background:#e94b42}.circle{width:28px;height:28px;border-radius:50%;background:#ffffff2b;display:grid;place-items:center}.open{margin-top:9px;border:1px solid #3c475d;background:#1a2030;border-radius:8px;width:100%;height:42px;color:#aab3c2;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:10px}.open b{color:#248bf0}.tradebox{display:none;margin-top:8px;background:#181f30;border:1px solid #39455d;border-radius:8px;padding:9px;font-size:10px}.tradebox.show{display:block}.tr{display:flex;justify-content:space-between;padding:3px 0;color:#8995aa}.tr b{color:#fff}.green{color:#13d681!important}.red{color:#ff6b64!important}.bottom{height:64px;flex:0 0 64px;background:#1b2130;border-top:1px solid #30384b;display:grid;grid-template-columns:repeat(5,1fr);z-index:40}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7d8799;text-decoration:none;font-size:9px;font-weight:900;position:relative}.bottom a.active{color:#f4f7fb}.navico{font-size:22px;line-height:20px}.navbadge{position:absolute;top:5px;margin-left:28px;background:#2589ee;color:#fff;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10px}
@media(min-width:1001px){.top{height:68px;flex-basis:68px}.bottom{display:none}.layout{padding:10px;gap:10px;flex-direction:row}.market{border:1px solid #303c52;border-radius:12px;overflow:hidden}.side{border:1px solid #303c52;border-radius:12px;height:max-content;max-height:calc(100vh - 88px)}.chartbox{min-height:520px}.status{height:28px;flex-basis:28px}}
@media(max-width:1000px){.brand{display:none}.top{height:61px;flex-basis:61px}.deposit{padding:0 11px}.layout{padding-bottom:0}.side{position:relative;left:auto;right:auto;bottom:auto;width:100%;z-index:20;border-left:0;border-top:1px solid #394359;border-radius:16px 16px 0 0;padding:9px 10px 9px;max-height:44dvh;overflow:hidden;box-shadow:0 -12px 30px #0005}.charthead{height:39px;flex-basis:39px}.toolbar{height:34px;flex-basis:34px}.toolbar .tool:nth-child(-n+6){display:none}.chartbox{min-height:390px}.status{display:none}.assetbar{margin-bottom:6px}.asset{height:31px}.fields{gap:8px}.inputbox{height:48px}.actions{margin-top:7px}.actions button{height:53px}.open{height:35px}.tradebox{max-height:120px;overflow:auto}.bottom{height:62px;flex-basis:62px}.account .bell{display:none}.balance{height:39px;min-width:108px}.deposit{height:39px;font-size:13px}.marker-text{top:7px;font-size:9px}.trade-line span{right:150px}.priceTag{right:7px}.vline{left:58%}}
@media(max-width:470px){.top{padding:0 8px}.logo{width:37px;height:37px}.balance{min-width:98px;padding:0 7px}.balance span{font-size:12px}.deposit{font-size:12px;padding:0 9px}.chartbox{min-height:325px}.side{max-height:none}.assetName{font-size:13px}.payout{font-size:14px}.inputbox{height:46px}.actions button{height:51px;font-size:16px}.bottom{height:60px;flex-basis:60px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">F</div><div class="brand">Funded<span>Edge</span></div>
  <div class="account">
    <div class="balance"><b>DEMO</b><span id="balance">$1,000.00</span><span>⌄</span></div>
    <button class="bell">♧<i class="badge">2</i></button>
    <button class="deposit" onclick="location.href='challenge.html'">Deposit</button>
  </div>
</header>
<main class="layout">
<section class="market">
  <div class="charthead"><div class="marketinfo"><span class="pair" id="pair">BTC/USD</span><span class="live" id="source">LIVE</span></div><div class="quote" id="quote">—</div></div>
  <div class="toolbar">
    <button class="tool">•••</button><button class="tool">▣</button><button class="tool">╱</button><button class="tool">↗</button><button class="tool">⌁</button><button class="tool">◫</button>
    <button class="tool tf active" data-tf="1m">1m</button><button class="tool tf" data-tf="5m">5m</button><button class="tool tf" data-tf="15m">15m</button><button class="tool tf" data-tf="30m">30m</button><button class="tool tf" data-tf="1h">1H</button><button class="tool tf" data-tf="4h">4H</button><button class="tool tf" data-tf="1d">1D</button>
  </div>
  <div class="chartbox">
    <div id="chart" class="chart"></div>
    <div class="label" id="chartLabel">BTC/USD</div>
    <div class="marker-text" id="markerText"><span>Beginning of trade</span><span>End of trade</span></div>
    <div class="trade-line" id="tradeLine"><span id="lineTimer">00:00</span></div><div class="vline" id="vline"></div>
    <div class="priceTag" id="priceTag">—</div>
  </div>
</section>
<aside class="side">
  <div class="assetbar" id="assetTabs"></div>
  <div class="controlTop"><div><div class="assetName" id="assetName">BTC/USD</div><div class="pending">PENDING TRADE <span class="switch"><i></i></span></div></div><div class="payout" id="payout">93%</div></div>
  <div class="fields">
    <div class="field"><label>Trade Time</label><div class="inputbox"><select id="timerInput"><option value="00:00:30" data-sec="30">30 Sec</option><option value="00:01:00" data-sec="60" selected>1 Min</option><option value="00:02:00" data-sec="120">2 Min</option><option value="00:05:00" data-sec="300">5 Min</option><option value="00:10:00" data-sec="600">10 Min</option><option value="00:15:00" data-sec="900">15 Min</option><option value="00:30:00" data-sec="1800">30 Min</option><option value="01:00:00" data-sec="3600">1 Hour</option></select></div></div>
    <div class="field"><label>Investment</label><div class="inputbox"><div class="stepper"><button class="step" onclick="changeAmount(-1)">−</button><strong id="amountText">$1</strong><button class="step" onclick="changeAmount(1)">+</button></div></div></div>
  </div>
  <div class="switchText">SWITCH</div>
  <div class="payoutrow"><span>Payout</span><b id="payoutValue">$1.93</b></div>
  <div class="actions"><button class="up" onclick="trade('CALL')"><span>Up</span><span class="circle">↑</span></button><button class="down" onclick="trade('PUT')"><span>Down</span><span class="circle">↓</span></button></div>
  <button class="open" onclick="toggleTrades()"><span>Open Trades <b id="tradeCount">0</b></span><span id="arrow">⌄</span></button>
  <div class="tradebox" id="tradeBox"><div class="tr"><b id="tradeMarket">BTC/USD · UP</b><b id="tradeState" class="green">● Open</b></div><div class="tr"><span>Entry</span><b id="entry">—</b></div><div class="tr"><span>Current</span><b id="current">—</b></div><div class="tr"><span>Investment</span><b id="tradeAmount">$1.00</b></div><div class="tr"><span>Profit</span><b id="profit" class="green">+$0.93</b></div><div class="tr"><span>Expires in</span><b id="timer">01:00</b></div><div class="tr"><span id="statusText">Waiting for price…</span></div></div>
</aside>
</main>
<nav class="bottom">
  <a class="active" href="dashboard.html"><span class="navico">▰</span>Trade</a>
  <a href="index.html"><span class="navico">?</span>Help</a>
  <a href="auth.html"><span class="navico">♟</span>Account</a>
  <a href="history.html"><span class="navico">♜</span><i class="navbadge">3</i>Tournament</a>
  <a href="history.html"><span class="navico">•••</span><i class="navbadge">4</i>More</a>
</nav>
</div>
<script>
const API='https://fundededge-api.onrender.com';
const assets={BTC:{name:'BTC/USD',symbol:'BTC-USD',digits:2},ETH:{name:'ETH/USD',symbol:'ETH-USD',digits:2},XAU:{name:'XAU/USD',symbol:'XAUUSD',digits:2},EUR:{name:'EUR/USD',symbol:'EURUSD',digits:5},GBP:{name:'GBP/USD',symbol:'GBPUSD',digits:5}};
let selected='BTC',price=0,chart,series,tf='1m',amount=1,expiry=60,openTrade=null,tradeTimer=null,balance=1000,lastBar=0;
const $=id=>document.getElementById(id);
const fmt=v=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:assets[selected].digits,maximumFractionDigits:assets[selected].digits});
function renderTabs(){let h='';for(const[k,a]of Object.entries(assets))h+=`<button class="asset ${k===selected?'active':''}" onclick="switchAsset('${k}')">${a.name}</button>`;$('assetTabs').innerHTML=h}
function setBalance(v){balance=Number(v||0);$('balance').textContent='$'+balance.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function updateAmount(){amount=Math.max(1,amount);$('amountText').textContent='$'+amount;$('tradeAmount').textContent='$'+amount.toFixed(2);$('profit').textContent='+$'+(amount*.93).toFixed(2);$('payoutValue').textContent='$'+(amount*1.93).toFixed(2)}
function changeAmount(n){amount=Math.max(1,amount+n);updateAmount()}
function setPrice(p){p=Number(p);if(!Number.isFinite(p)||p<=0)return;price=p;$('quote').textContent=fmt(p);$('priceTag').textContent=fmt(p);if(series){const sec=tf==='1m'?60:tf==='5m'?300:tf==='15m'?900:tf==='30m'?1800:tf==='1h'?3600:tf==='4h'?14400:86400,t=Math.floor(Date.now()/1000/sec)*sec;let b=series._live;if(lastBar===t&&b)b={time:t,open:b.open,high:Math.max(b.high,p),low:Math.min(b.low,p),close:p};else b={time:t,open:p,high:p,low:p,close:p};series._live=b;series.update(b);lastBar=t}if(openTrade)updateTrade()}
async function loadCandles(){try{const a=assets[selected];const r=await fetch(API+'/api/market/'+encodeURIComponent(a.symbol)+'/candles?interval='+tf+'&limit=120',{cache:'no-store'});const j=await r.json();if(Array.isArray(j.candles)&&j.candles.length>2){series.setData(j.candles.slice(-120).map(x=>({time:Number(x.time),open:Number(x.open),high:Number(x.high),low:Number(x.low),close:Number(x.close)})));series._live=j.candles[j.candles.length-1];lastBar=series._live.time;setPrice(series._live.close);chart.timeScale().fitContent();$('source').textContent=(j.source||'LIVE').replace('Exness MT5 bridge','EXNESS').toUpperCase();return}}catch(e){}try{const r=await fetch(API+'/api/market/'+encodeURIComponent(assets[selected].symbol),{cache:'no-store'}),j=await r.json();if(j.price){setPrice(j.price);$('source').textContent=(j.source||'LIVE').replace('Exness MT5 bridge','EXNESS').toUpperCase()}}catch(e){$('source').textContent='OFFLINE'}}
function feed(){setInterval(async()=>{try{const j=await (await fetch(API+'/api/market/'+encodeURIComponent(assets[selected].symbol),{cache:'no-store'})).json();if(j.price)setPrice(j.price)}catch(e){}},1200)}
function init(){chart=LightweightCharts.createChart($('chart'),{layout:{background:{type:'solid',color:'#171c2b'},textColor:'#818da1'},grid:{vertLines:{color:'#252c3d'},horzLines:{color:'#252c3d'}},rightPriceScale:{borderColor:'#343c50'},timeScale:{borderColor:'#343c50',timeVisible:true,secondsVisible:false,barSpacing:7,rightOffset:8},crosshair:{mode:1}});series=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#0fbd69',downColor:'#ef5a52',borderUpColor:'#0fbd69',borderDownColor:'#ef5a52',wickUpColor:'#0fbd69',wickDownColor:'#ef5a52',priceFormat:{type:'price',precision:2,minMove:.01}});renderTabs();loadCandles();feed();setBalance(1000);updateAmount()}
function trade(dir){expiry=Number($('timerInput').selectedOptions[0].dataset.sec||60);if(!price)return alert('Market price is loading.');if(openTrade)return alert('Finish the current trade first.');if(amount>balance)return alert('Investment is higher than your demo balance.');const now=Date.now();openTrade={dir,entry:price,amount,expires:now+expiry*1000};$('tradeCount').textContent='1';$('tradeBox').classList.add('show');$('arrow').textContent='⌃';$('tradeMarket').textContent=assets[selected].name+' · '+(dir==='CALL'?'UP':'DOWN');$('entry').textContent=fmt(price);$('current').textContent=fmt(price);$('statusText').textContent=dir==='CALL'?'↑ UP opened — closes above entry = WIN':'↓ DOWN opened — closes below entry = WIN';$('tradeLine').style.display='block';$('vline').style.display='block';clearInterval(tradeTimer);tradeTimer=setInterval(updateTrade,250);updateTrade()}
function updateTrade(){if(!openTrade)return;const left=Math.max(0,Math.ceil((openTrade.expires-Date.now())/1000));const m=Math.floor(left/60),s=left%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('lineTimer').textContent=$('timer').textContent;$('timerInput').value='00:'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('current').textContent=fmt(price);if(Date.now()>=openTrade.expires){const win=openTrade.dir==='CALL'?price>openTrade.entry:price<openTrade.entry;balance+=win?openTrade.amount*.93:-openTrade.amount;setBalance(balance);$('tradeState').textContent=win?'✓ WIN':'✕ LOSS';$('tradeState').className=win?'green':'red';$('statusText').textContent=win?'Trade expired — profit added':'Trade expired — investment deducted';clearInterval(tradeTimer);openTrade=null;$('tradeCount').textContent='0';$('tradeLine').style.display='none';$('vline').style.display='none';setTimeout(()=>{$('tradeBox').classList.remove('show');$('arrow').textContent='⌄'},1300)}}
function toggleTrades(){const x=$('tradeBox');x.classList.toggle('show');$('arrow').textContent=x.classList.contains('show')?'⌃':'⌄'}
async function switchAsset(k){if(openTrade)return alert('Finish the current trade first.');selected=k;$('pair').textContent=assets[k].name;$('assetName').textContent=assets[k].name;$('chartLabel').textContent=assets[k].name;series.setData([]);series._live=null;lastBar=0;renderTabs();await loadCandles()}
document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tf]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tf=b.dataset.tf;loadCandles()});$('timerInput').addEventListener('change',()=>{expiry=Number($('timerInput').selectedOptions[0].dataset.sec||60)});
addEventListener('resize',()=>chart&&chart.applyOptions({width:$('chart').clientWidth,height:$('chart').clientHeight}));
init();
</script>
</body></html>
