<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FundedEdge — Trade</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101828;color:#eaf0f8;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;background:#111a2b}
.top{height:76px;flex:0 0 76px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#18233a;border-bottom:1px solid #293750}
.logo{width:50px;height:50px;border-radius:14px;background:linear-gradient(145deg,#687cf4,#3e53d8);display:grid;place-items:center;font-weight:1000;font-size:24px;box-shadow:0 8px 22px #0003}.brand{font-size:20px;font-weight:950;letter-spacing:-.5px}.brand span{color:#8c9bff}
.account{margin-left:auto;display:flex;align-items:center;gap:8px}.demo{height:48px;min-width:136px;border:2px solid #3d5b89;border-radius:12px;background:#202d47;display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;font-weight:950;font-size:17px}.demo b{background:#4b5260;color:#ffd21c;padding:6px 10px;border-radius:8px;font-size:13px}.deposit{height:48px;border:0;border-radius:12px;background:#1fe58c;color:#062016;padding:0 18px;font-weight:1000;font-size:17px}
.assets{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#1b2941;border-bottom:1px solid #2b3a55;overflow:auto;scrollbar-width:none}.assets::-webkit-scrollbar{display:none}.asset{height:38px;white-space:nowrap;border:1px solid #334764;background:#202f49;color:#b8c5d7;border-radius:9px;padding:0 12px;font-size:12px;font-weight:900}.asset.active{background:#34446a;color:#fff;border-color:#7289e9;box-shadow:inset 0 -2px #7d91ff}
.layout{min-height:0;flex:1;display:flex;position:relative;background:#111a2b}.market{min-width:0;min-height:0;flex:1;display:flex;flex-direction:column}.markethead{height:54px;flex:0 0 54px;display:flex;align-items:center;padding:0 12px;background:#111a2b;border-bottom:1px solid #27364f}.pair{font-size:18px;font-weight:1000}.otc{margin-left:7px;color:#8b9cfb;background:#27355b;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:1000}.quote{margin-left:auto;font-size:20px;font-weight:1000}.charttools{height:48px;display:flex;align-items:center;gap:4px;padding:4px 8px;background:#17243a;border-bottom:1px solid #293851;overflow:auto;scrollbar-width:none}.charttools::-webkit-scrollbar{display:none}.tool{height:34px;min-width:34px;border:0;background:transparent;color:#aab8ca;border-radius:7px;font-size:18px}.tool.active{background:#2c3c5c;color:#fff}.tf{font-size:11px!important;font-weight:900!important}.chartbox{position:relative;flex:1;min-height:250px}.chart{position:absolute;inset:0}.chartlabel{position:absolute;z-index:4;top:9px;left:10px;padding:5px 8px;border-radius:7px;background:#19253a;color:#a9b8cb;font-size:10px;pointer-events:none}.priceTag{position:absolute;right:8px;top:50%;z-index:4;background:#283651;border-radius:6px;padding:6px 8px;font-size:11px;font-weight:900;color:#fff;pointer-events:none}.status{height:30px;flex:0 0 30px;border-top:1px solid #293851;background:#111a2b;display:flex;align-items:center;padding:0 10px;color:#8495ab;font-size:9px}.status i{width:7px;height:7px;border-radius:50%;background:#20e48c;margin-right:5px}.side{position:absolute;left:8px;right:8px;bottom:8px;z-index:10;background:#18243aee;border:1px solid #3b4c68;border-radius:14px;padding:9px;box-shadow:0 16px 40px #0007;backdrop-filter:blur(15px)}.dur{display:flex;gap:6px;margin-bottom:7px}.dur button{flex:1;height:36px;border:1px solid #344764;background:#1d2b43;color:#9eacc0;border-radius:8px;font-size:12px;font-weight:950}.dur button.active{background:#6679ed;color:#fff;border-color:#8393ff}.moneyrow{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:7px}.label{font-size:9px;color:#8e9fb4;margin-bottom:3px}.money{height:43px;background:#121d31;border:1px solid #3b4d6a;border-radius:9px;display:flex;align-items:center}.money span{padding:0 10px;color:#71829a;font-size:18px}.money input{width:100%;height:100%;border:0;outline:0;background:transparent;color:#fff;font-size:18px;font-weight:1000}.payout{height:43px;border-radius:9px;border:1px solid #1d9e68;background:#10291f;color:#20e48c;display:grid;place-items:center;font-size:16px;font-weight:1000}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.actions button{height:49px;border:0;border-radius:10px;color:#fff;font-size:15px;font-weight:1000}.up{background:#20bf7a}.down{background:#e84c61}.actions button small{display:block;font-size:9px;opacity:.85;margin-top:1px}.open{margin-top:7px;width:100%;height:36px;border:1px solid #344965;background:#121e32;border-radius:8px;color:#b6c2d3;font-size:11px;font-weight:950;display:flex;align-items:center;justify-content:space-between;padding:0 11px}.open b{color:#7f91ff}.tradebox{display:none;margin-top:7px;border:1px solid #3a4e6a;border-radius:9px;padding:8px;background:#111c30;font-size:10px}.tradebox.show{display:block}.trhead,.tr{display:flex;justify-content:space-between;padding:3px 0}.tr{color:#8e9db1}.tr b,.trhead b{color:#fff}.green{color:#20e48c!important}.red{color:#ff6677!important}.result{border-top:1px solid #2d3e57;margin-top:4px;padding-top:5px;font-weight:900}.bottom{height:64px;flex:0 0 64px;display:grid;grid-template-columns:repeat(4,1fr);background:#18243a;border-top:1px solid #2b3b55;z-index:20}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8192a8;text-decoration:none;font-size:9px;font-weight:850}.bottom a.active{color:#7f91ff}.ico{font-size:20px;line-height:20px}.lock{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:50}.lockbox{margin:20px;background:#18243a;border:1px solid #435777;border-radius:14px;padding:25px;text-align:center}.lockbox button{background:#7b8cff;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-weight:900}
@media(min-width:1001px){
 .top{height:70px;flex-basis:70px}.assets{height:50px;flex-basis:50px}.layout{padding:10px;gap:10px}.market{border:1px solid #293a55;border-radius:12px;overflow:hidden}.side{position:static;width:330px;flex:0 0 330px;align-self:flex-start;box-shadow:none;backdrop-filter:none}.chartbox{min-height:520px}.bottom{display:none}.status{height:34px;flex-basis:34px}.brand{font-size:22px}
}
@media(max-width:1000px){
  html,body{overflow:hidden}
  .top{height:62px;flex-basis:62px;padding:0 9px;gap:8px}
  .logo{width:42px;height:42px;border-radius:11px;font-size:21px}
  .brand{font-size:18px}
  .account{gap:6px}
  .demo{height:40px;min-width:92px;padding:0 8px;font-size:12px;gap:5px}
  .demo b{padding:4px 6px;font-size:9px}
  .deposit{display:none}
  .account{margin-left:auto}
  .demo{min-width:118px}
  .assets{height:48px;flex-basis:48px;padding:5px 7px}
  .asset{height:34px;padding:0 9px;font-size:10px}
  .layout{padding-bottom:64px}
  .markethead{height:48px;flex-basis:48px}
  .pair{font-size:16px}
  .quote{font-size:17px}
  .chartbox{min-height:300px}
  .side{left:18px;right:18px;bottom:72px;border-radius:18px;padding:12px}
  .dur{gap:7px;margin-bottom:9px}
  .dur button{height:42px;font-size:12px}
  .moneyrow{grid-template-columns:minmax(0,1fr) 94px;gap:9px}
  .money,.payout{height:50px}
  .actions{gap:9px;margin-top:9px}
  .actions button{height:58px;font-size:17px;border-radius:13px}
  .open{height:44px;margin-top:9px}
  .charttools{padding-left:10px;padding-right:10px}
  .chartbox{min-height:280px}
  .bottom{display:grid;position:fixed;left:0;right:0;bottom:0;height:64px}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">F</div><div class="brand">Funded<span>Edge</span></div>
  <div class="account"><div class="demo"><b>DEMO</b><span id="balance">$0.00</span>⌄</div><button class="deposit" onclick="location.href='challenge.html'">+ Deposit</button></div>
</header>
<div class="assets" id="assetTabs"></div>
<main class="layout">
<section class="market">
  <div class="markethead"><div><span class="pair" id="pair">BTC/USD</span><span class="otc">OTC</span></div><div class="quote" id="quote">—</div></div>
  <div class="charttools">
    <button class="tool">◫</button><button class="tool">〰</button><button class="tool">╱</button><button class="tool">↗</button><button class="tool">↗</button><button class="tool">━</button><button class="tool">│</button><button class="tool">≋</button>
    <button class="tool tf active" data-tf="1m">1m</button><button class="tool tf" data-tf="5m">5m</button><button class="tool tf" data-tf="15m">15m</button><button class="tool tf" data-tf="1h">1H</button>
  </div>
  <div class="chartbox"><div id="chart" class="chart"></div><div class="chartlabel">BTC/USD · OTC</div><div class="priceTag" id="priceTag">—</div></div>
  <div class="status"><i></i>Market Open <span style="margin-left:auto" id="clock">—</span></div>
</section>
<aside class="side">
  <div class="dur" id="expiry"><button class="active" data-v="300">00:05</button><button data-v="600">00:10</button><button data-v="1800">00:30</button><button data-v="3600">01:00</button><button data-v="7200">02:00</button></div>
  <div class="moneyrow"><div><div class="label">Investment</div><div class="money"><span>$</span><input id="amount" type="number" min="1" step="1" value="10"></div></div><div><div class="label">PAYOUT</div><div class="payout">+88%</div></div></div>
  <div class="actions"><button class="up" onclick="trade('CALL')">▲ Up<small>Higher</small></button><button class="down" onclick="trade('PUT')">▼ Down<small>Lower</small></button></div>
  <button class="open" onclick="toggleTrades()"><span>Open Trades <b id="tradeCount">0</b></span><span id="arrow">⌄</span></button>
  <div class="tradebox" id="tradeBox"><div class="trhead"><b id="tradeMarket">BTC/USD · CALL</b><b id="tradeState" class="green">● Open</b></div><div class="tr"><span>Entry</span><b id="entry">—</b></div><div class="tr"><span>Current</span><b id="current">—</b></div><div class="tr"><span>Investment</span><b id="tradeAmount">$0.00</b></div><div class="tr"><span>Profit</span><b class="green" id="profit">+$0.00</b></div><div class="tr"><span>Expires in</span><b id="timer">00:00</b></div><div class="result" id="statusText">Waiting for price…</div></div>
</aside>
</main>
<nav class="bottom"><a class="active" href="dashboard.html"><span class="ico">↗</span>Trade</a><a href="index.html"><span class="ico">▥</span>Markets</a><a href="history.html"><span class="ico">▤</span>History</a><a href="auth.html"><span class="ico">♙</span>Account</a></nav>
</div>
<div class="lock" id="lock"><div class="lockbox"><h3>Dashboard locked</h3><p>Login to access your funded account.</p><button onclick="location.href='auth.html?return=dashboard.html'">Login</button></div></div>
<script>
const API='https://fundededge-api.onrender.com',token=localStorage.getItem('fe_token');
const assets={BTCOTC:{name:'BTC/USD',full:'BTC/USD OTC',icon:'₿',symbol:'BTCUSD-OTC',digits:2},ETHOTC:{name:'ETH/USD',full:'ETH/USD OTC',icon:'Ξ',symbol:'ETHUSD-OTC',digits:2},XAUOTC:{name:'XAU/USD',full:'XAU/USD OTC',icon:'Au',symbol:'XAUUSD-OTC',digits:2},EUROTC:{name:'EUR/USD',full:'EUR/USD OTC',icon:'€',symbol:'EURUSD-OTC',digits:5},GBPOTC:{name:'GBP/USD',full:'GBP/USD OTC',icon:'£',symbol:'GBPUSD-OTC',digits:5}};
let selected='BTCOTC',price=0,chart,series,markers,tf='1m',expiry=300,openTrade=null,tradeTimer=null,accountBalance=0,lastBarTime=0,entryLine=null;
const $=id=>document.getElementById(id),fmt=v=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:assets[selected].digits,maximumFractionDigits:assets[selected].digits});
function renderTabs(){let h='';for(const[k,a]of Object.entries(assets))h+=`<button class="asset ${k===selected?'active':''}" onclick="switchAsset('${k}')">${a.icon} ${a.name} <small>OTC</small></button>`;$('assetTabs').innerHTML=h}
function setBalance(v){accountBalance=Number(v||0);$('balance').textContent='$'+accountBalance.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function setPrice(p){p=Number(p);if(!Number.isFinite(p)||p<=0)return;price=p;$('quote').textContent=fmt(p);$('priceTag').textContent=fmt(p);if(series){const sec=tf==='1m'?60:tf==='5m'?300:tf==='15m'?900:3600,b=Math.floor(Date.now()/1000/sec)*sec;let bar=series._live;if(lastBarTime===b&&bar)bar={time:b,open:bar.open,high:Math.max(bar.high,p),low:Math.min(bar.low,p),close:p};else bar={time:b,open:p,high:p,low:p,close:p};series._live=bar;series.update(bar);lastBarTime=b}if(openTrade)updateTrade()}
async function loadCandles(){if(!series)return;const a=assets[selected],sec=tf==='1m'?60:tf==='5m'?300:tf==='15m'?900:3600;try{const r=await fetch(API+'/api/market/'+encodeURIComponent(a.symbol)+'?interval=1m&range=1d'),j=await r.json();const p=Number(j.price);let data=[];if(Number.isFinite(p)){const now=Math.floor(Date.now()/1000);for(let i=90;i>=1;i--){const x=p*(1+(Math.random()-.5)*.008);data.push({time:now-i*60,open:x,high:x*(1+Math.random()*.002),low:x*(1-Math.random()*.002),close:p*(1+(Math.random()-.5)*.004)})}data.push({time:now,open:p,high:p,low:p,close:p})}if(data.length){series.setData(data);series._live=data[data.length-1];lastBarTime=data[data.length-1].time;setPrice(p);chart.timeScale().fitContent()}}catch(e){}}
function feed(){setInterval(async()=>{try{const a=assets[selected],r=await fetch(API+'/api/market/'+encodeURIComponent(a.symbol)+'?interval=1m&range=1d',{cache:'no-store'}),j=await r.json();if(j.price)setPrice(j.price)}catch(e){}},1200)}
function init(){chart=LightweightCharts.createChart($('chart'),{layout:{background:{type:'solid',color:'#111a2b'},textColor:'#8294aa'},grid:{vertLines:{color:'#1e2b42'},horzLines:{color:'#1e2b42'}},rightPriceScale:{borderColor:'#2b3b55'},timeScale:{borderColor:'#2b3b55',timeVisible:true,secondsVisible:false},crosshair:{mode:1}});series=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#1fd58a',downColor:'#f34f61',borderUpColor:'#1fd58a',borderDownColor:'#f34f61',wickUpColor:'#1fd58a',wickDownColor:'#f34f61',priceFormat:{type:'price',precision:2,minMove:.01}});try{markers=LightweightCharts.createSeriesMarkers(series,[])}catch(e){}renderTabs();loadCandles();feed();loadAccount()}
async function loadAccount(){
  // New interface: allow demo access even when the authentication API is not connected.
  if(!token){
    setBalance(1000);
    $('lock').style.display='none';
    localStorage.setItem('fe_demo','1');
    return;
  }
  try{
    const r=await fetch(API+'/api/me',{headers:{Authorization:'Bearer '+token}});
    const m=await r.json();
    const a=m.accounts?.[0];
    if(!a)throw Error('No account');
    setBalance(a.balance);
    $('lock').style.display='none';
  }catch(e){
    setBalance(1000);
    $('lock').style.display='none';
    localStorage.setItem('fe_demo','1');
  }
}
function placeMarker(dir){try{markers?.setMarkers([{time:Math.floor(Date.now()/1000),position:dir==='CALL'?'belowBar':'aboveBar',color:dir==='CALL'?'#1fd58a':'#f34f61',shape:dir==='CALL'?'arrowUp':'arrowDown',text:dir==='CALL'?'UP':'DOWN'}])}catch(e){}}
function trade(dir){const amount=Number($('amount').value);if(!price)return alert('Market price is loading.');if(!amount||amount<=0)return alert('Enter a valid investment amount.');if(amount>accountBalance)return alert('Investment is higher than your account balance.');if(openTrade)return alert('Close the current trade first.');const now=Date.now();openTrade={dir,entry:price,amount,expires:now+expiry*1000};placeMarker(dir);$('tradeCount').textContent='1';$('tradeBox').classList.add('show');$('arrow').textContent='⌃';$('tradeMarket').textContent=assets[selected].name+' · '+dir;$('entry').textContent=fmt(price);$('current').textContent=fmt(price);$('tradeAmount').textContent='$'+amount.toFixed(2);$('profit').textContent='+$'+(amount*.88).toFixed(2);$('tradeState').textContent='● Open';$('statusText').textContent=dir==='CALL'?'↑ UP opened — finish above entry':'↓ DOWN opened — finish below entry';clearInterval(tradeTimer);tradeTimer=setInterval(updateTrade,250)}
function updateTrade(){if(!openTrade)return;const d=price-openTrade.entry,win=openTrade.dir==='CALL'?d>0:d<0;$('current').textContent=fmt(price);$('timer').textContent=(Math.max(0,Math.ceil((openTrade.expires-Date.now())/1000))).toString().padStart(2,'0');if(Date.now()>=openTrade.expires){const pnl=win?openTrade.amount*.88:-openTrade.amount;accountBalance+=pnl;setBalance(accountBalance);$('tradeState').textContent=win?'✓ WIN':'✕ LOSS';$('tradeState').className=win?'green':'red';$('statusText').textContent=win?'✓ Expired WIN — profit added':'✕ Expired LOSS — investment deducted';$('statusText').className='result '+(win?'green':'red');clearInterval(tradeTimer);openTrade=null;$('tradeCount').textContent='0';setTimeout(()=>{$('tradeBox').classList.remove('show');$('arrow').textContent='⌄'},1600)}}
function toggleTrades(){const x=$('tradeBox');x.classList.toggle('show');$('arrow').textContent=x.classList.contains('show')?'⌃':'⌄'}
async function switchAsset(k){if(openTrade)return alert('Finish the current trade first.');selected=k;renderTabs();$('pair').textContent=assets[k].name;series.setData([]);series._live=null;lastBarTime=0;await loadCandles()}
document.querySelectorAll('#expiry button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('#expiry button').forEach(x=>x.classList.remove('active'));b.classList.add('active');expiry=Number(b.dataset.v)});
document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tf]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tf=b.dataset.tf;loadCandles()});
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})},1000);
addEventListener('resize',()=>chart&&chart.applyOptions({width:$('chart').clientWidth,height:$('chart').clientHeight}));
init();
</script>
</body></html>
