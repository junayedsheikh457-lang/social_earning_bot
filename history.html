<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FundedEdge Pro — History</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020b14;color:#eef6ff;font-family:Inter,system-ui,Arial,sans-serif}.top{height:58px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #1d3348;background:#04101b;gap:18px}.logo{font-size:18px;font-weight:950}.logo span{color:#18e879}.nav{display:flex;gap:18px;height:100%}.nav a{display:flex;align-items:center;color:#8294a8;text-decoration:none;font-size:12px}.nav a.active{color:#18e879;border-bottom:2px solid #18e879;font-weight:900}.funded{margin-left:auto;border:1px solid #1e9c67;border-radius:9px;padding:5px 9px;color:#19e878;text-align:right}.funded small{display:block;color:#8fa2b6;font-size:8px}.funded b{font-size:13px}.wrap{padding:12px;max-width:900px;margin:auto}.title{font-size:18px;font-weight:950;margin:4px 0 12px}.empty{border:1px solid #203a52;border-radius:10px;padding:24px;text-align:center;color:#8194a8;background:#061522}.item{border:1px solid #203a52;border-radius:10px;padding:11px;margin-bottom:8px;background:#061522}.head{display:flex;justify-content:space-between;font-weight:900}.call{color:#18e879}.put{color:#ff4755}.win{color:#18e879}.loss{color:#ff4755}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px;color:#8fa2b6;font-size:10px}.grid b{display:block;color:#fff;font-size:11px;margin-top:2px}.date{font-size:9px;color:#64798d;margin-top:8px}@media(min-width:700px){.top{height:62px;padding:0 18px}.logo{font-size:22px}.nav{gap:26px}.nav a{font-size:14px}.funded small{font-size:10px}.funded b{font-size:16px}.wrap{padding:22px}}
</style></head><body><header class="top"><div class="logo">FundedEdge <span>Pro</span></div><nav class="nav"><a href="dashboard.html">Trade</a><a class="active" href="history.html">History</a></nav><div class="funded"><small>FUNDED ACCOUNT</small><b id="balance">$0.00</b></div></header><main class="wrap"><div class="title">Trade History</div><div id="list"></div></main><script>const API='https://fundededge-api.onrender.com',token=localStorage.getItem('fe_token'),list=document.getElementById('list');const money=v=>'$'+Number(v||0).toFixed(2);async function load(){let rows=[];try{if(token){let r=await fetch(API+'/api/trades',{headers:{Authorization:'Bearer '+token}});if(r.ok){let j=await r.json();rows=Array.isArray(j)?j:(j.trades||[])}}}catch(e){}try{const local=JSON.parse(localStorage.getItem('fe_trade_history')||'[]');rows=[...rows,...local]}catch(e){}const seen=new Set();rows=rows.filter(x=>{let k=x.id||x.created_at||[x.entry,x.direction,x.amount].join('|');if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>new Date(b.created_at||b.openedAt||0)-new Date(a.created_at||a.openedAt||0));if(!rows.length){list.innerHTML='<div class="empty">No trades yet. Your completed trades will appear here.</div>';return}list.innerHTML=rows.map(t=>{let dir=t.direction||t.dir||'CALL',win=(t.result||'').toUpperCase()==='WIN'||t.win===true,pnl=Number(t.pnl??t.delta??0),entry=Number(t.entry_price??t.entry??0),exit=Number(t.exit_price??t.exit??0),amt=Number(t.amount||0),d=t.created_at||t.openedAt;return `<div class="item"><div class="head"><span class="${dir==='CALL'?'call':'put'}">${dir==='CALL'?'Higher (Call) ↑':'Lower (Put) ↓'}</span><span class="${win?'win':'loss'}">${win?'WIN':'LOSS'} ${pnl>=0?'+':''}${money(pnl)}</span></div><div class="grid"><div>Asset<b>${t.asset||t.symbol||'BTC/USD'}</b></div><div>Entry<b>${entry||'—'}</b></div><div>Exit<b>${exit||'—'}</b></div><div>Investment<b>${money(amt)}</b></div><div>Profit/Loss<b>${pnl>=0?'+':''}${money(pnl)}</b></div><div>Expiry<b>${t.expiry||'—'}</b></div></div><div class="date">${d?new Date(d).toLocaleString():''}</div></div>`}).join('')}load();if(token)fetch(API+'/api/me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(m=>{let a=m.accounts?.[0];if(a)document.getElementById('balance').textContent=money(a.balance)}).catch(()=>{});</script></body></html>
