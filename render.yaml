services:
  - type: web
    name: social-earning-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_DIR
        value: /var/data
    disks:
      - name: data
        mountPath: /var/data
        sizeGB: 1
