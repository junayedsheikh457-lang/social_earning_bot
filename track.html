<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অর্ডার ট্র্যাক | Fashion Mart</title><link rel="stylesheet" href="style.css"><style>.track-wrap{max-width:520px;margin:55px auto;padding:0 18px}.track-card{border:1px solid var(--line);padding:26px;background:#fff}.track-card h1{margin:8px 0}.track-card p{color:var(--muted);font-size:13px}.track-card label{display:block;margin:15px 0 6px;font-weight:600}.track-card input{width:100%;padding:12px;border:1px solid var(--line)}.track-card button{margin-top:15px}.track-msg{margin-top:14px;background:var(--pale);padding:12px;color:var(--deep);font-size:12px}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">F</span><span>Fashion<span class="brand-pink">Mart</span><small>STYLE THAT FEELS LIKE YOU</small></span></a><a class="cart-button" href="index.html">শপিংয়ে ফিরুন</a></header><main class="track-wrap"><div class="track-card"><span class="eyebrow">ORDER SUPPORT</span><h1>অর্ডার ট্র্যাক করুন</h1><p>আপনার অর্ডার নম্বর ও ফোন নম্বর দিন।</p><form id="track-form"><label for="order-id">অর্ডার নম্বর</label><input id="order-id" required placeholder="যেমন: FM-12345"><label for="phone">মোবাইল নম্বর</label><input id="phone" required type="tel" placeholder="01XXXXXXXXX"><button class="primary-btn full">স্ট্যাটাস দেখুন ↗</button></form><div id="track-msg" class="track-msg" hidden></div></div></main><script>document.getElementById('track-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('track-msg');m.hidden=false;m.textContent='অর্ডার ট্র্যাকিং সার্ভার এখনো সংযুক্ত নয়। এই মুহূর্তে অর্ডারের স্ট্যাটাস যাচাই করা যাচ্ছে না।'});</script></body></html>
