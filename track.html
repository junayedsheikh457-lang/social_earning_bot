<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অর্ডার ট্র্যাক | Fashion Mart</title><link rel="stylesheet" href="style.css"></head><body><div class="top">FASHION MART · ORDER TRACKING</div><main style="max-width:620px;margin:45px auto;padding:20px"><h1>অর্ডার ট্র্যাক</h1><p>এই ব্রাউজারে সর্বশেষ ডেমো অর্ডার থাকলে দেখা যাবে।</p><button class="btn" id="show">সর্বশেষ অর্ডার দেখুন</button><pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><p>এটি লোকাল ডেমো; সার্ভার-ভিত্তিক ট্র্যাকিং এখনও সংযুক্ত নয়।</p><a href="index.html">← শপিংয়ে ফিরে যান</a></main><script>document.getElementById('show').onclick=()=>{try{document.getElementById('result').textContent=JSON.stringify(JSON.parse(localStorage.getItem('fm_last_order')),null,2)}catch{document.getElementById('result').textContent='এই ব্রাউজারে অর্ডার পাওয়া যায়নি।'}}</script></body></html>
