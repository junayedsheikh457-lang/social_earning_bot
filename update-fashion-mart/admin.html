<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UFM Admin</title><style>body{margin:0;font-family:Arial;background:#f4f6f8;color:#18202a}.bar{background:#10233b;color:#fff;padding:18px;font-size:22px;font-weight:800}.wrap{max-width:900px;margin:auto;padding:20px}.box{background:#fff;padding:20px;border-radius:15px;margin-bottom:18px;box-shadow:0 5px 20px #0001}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.active,.save{background:#10233b;color:#fff}.danger{background:#b42318;color:#fff}.panel{display:none}.panel.on{display:block}input,textarea,select{width:100%;padding:11px;margin:6px 0 14px;border:1px solid #ddd;border-radius:8px;font:inherit;box-sizing:border-box}.preview{display:flex;gap:8px;flex-wrap:wrap}.preview img{width:80px;height:80px;object-fit:cover;border-radius:8px}.item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.item img{width:65px;height:65px;object-fit:cover;border-radius:8px}.muted{color:#6d737c;font-size:13px}@media(max-width:650px){.item{grid-template-columns:60px 1fr}.item .actions{grid-column:2}.item img{width:55px;height:55px}}</style></head><body><div class="bar">UPDATE FASHION MART — ADMIN</div><div class="wrap"><div class="tabs"><button class="active" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('add',this)">➕ Add Product</button><button onclick="tab('list',this)">👗 Products</button><button onclick="tab('set',this)">⚙️ Settings</button><a href="index.html"><button>🌐 Website</button></a></div><div id="dash" class="panel on"><div class="box"><h2>Dashboard</h2><p>Products: <b id="count">0</b></p><p>Photos: <b id="photos">0</b></p><p class="muted">একটি product-এ ১টি cover photo + ৪–৫টি বা আরও gallery photo যোগ করতে পারবে। Website-এ cover প্রথমে দেখাবে এবং click করলে gallery দেখা যাবে।</p></div></div><div id="add" class="panel"><div class="box"><h2 id="ft">Add Product</h2><form id="form"><label>Product Name *</label><input id="name" required><label>Price (৳) *</label><input id="price" type="number" required><label>Badge</label><select id="badge"><option>NEW</option><option>BEST SELLER</option><option>TRENDING</option><option>SALE</option></select><label>Category</label><input id="cat"><label>Description</label><textarea id="desc"></textarea><label>Cover Photo *</label><input id="cover" type="file" accept="image/*" required><label>Gallery Photos</label><input id="gallery" type="file" accept="image/*" multiple><div id="preview" class="preview"></div><br><button class="save">💾 Save Product</button></form></div></div><div id="list" class="panel"><div class="box"><h2>Products</h2><div id="items"></div></div></div><div id="set" class="panel"><div class="box"><h2>Order Settings</h2><label>Messenger Link</label><input id="mess"><label>WhatsApp Number</label><input id="wa"><button class="save" onclick="saveSet()">Save Settings</button></div></div></div><script>let editing=null;function data(){try{return JSON.parse(localStorage.ufm_products)||[]}catch(e){return[]}}function put(x){localStorage.ufm_products=JSON.stringify(x)}function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function file(f){return new Promise((r,j)=>{let x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}gallery.onchange=async()=>{preview.innerHTML='';for(let f of gallery.files){let i=document.createElement('img');i.src=await file(f);preview.appendChild(i)}};form.onsubmit=async e=>{e.preventDefault();let a=data(),old=a.find(x=>x.id===editing),cf=cover.files[0];let cv=cf?await file(cf):old?.cover;if(!cv)return;let gf=[...gallery.files],imgs=gf.length?await Promise.all(gf.map(file)):(old?.images||[cv]);if(!imgs.includes(cv))imgs.unshift(cv);let p={id:editing||Date.now(),title:name.value,price:Number(price.value),badge:badge.value,category:cat.value,desc:desc.value,cover:cv,images:imgs};a=editing?a.map(x=>x.id===editing?p:x):[p,...a];put(a);alert('Product saved');reset();tab('list')};function reset(){editing=null;form.reset();preview.innerHTML='';ft.textContent='Add Product';cover.required=true}function edit(id){let p=data().find(x=>x.id===id);editing=id;name.value=p.title;price.value=p.price;badge.value=p.badge||'NEW';cat.value=p.category||'';desc.value=p.desc||'';cover.required=false;ft.textContent='Edit Product';tab('add')}function delp(id){if(confirm('Delete product?')){put(data().filter(x=>x.id!==id));render()}}function render(){let a=data();count.textContent=a.length;photos.textContent=a.reduce((n,p)=>n+(p.images?.length||1),0);items.innerHTML=a.map(p=>`<div class="item"><img src="${p.cover}"><div><b>${p.title}</b><br><span class="muted">৳ ${Number(p.price).toLocaleString('en-BD')} • ${p.images?.length||1} photos</span></div><div class="actions"><button onclick="edit(${p.id})">Edit</button> <button class="danger" onclick="delp(${p.id})">Delete</button></div></div>`).join('')||'<p class="muted">No products yet.</p>';let s=JSON.parse(localStorage.ufm_settings||'{}');mess.value=s.messenger||'';wa.value=s.whatsapp||''}function saveSet(){localStorage.ufm_settings=JSON.stringify({messenger:mess.value,whatsapp:wa.value});alert('Settings saved')}render();</script></body></html>
