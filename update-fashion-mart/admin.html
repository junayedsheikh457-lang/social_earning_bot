<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Fashion Mart — Admin</title><style>:root{--ink:#241f1e;--rose:#b96f70;--soft:#fff7f2;--line:#eaded8;--green:#1f9d5b}*{box-sizing:border-box}body{margin:0;background:#f5efeb;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font:30px Georgia,serif}.brand span{color:var(--rose)}.login{display:flex;gap:8px}.input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.login .input{width:220px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#2b2625;color:#fff;font-weight:700;cursor:pointer}.rose{background:var(--rose)}.green{background:var(--green)}.danger{background:#fff;color:#b33;border:1px solid #ecc}.msg{padding:10px 0;color:#756b67}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.stat small{color:#777}.stat b{font-size:25px;display:block;margin-top:6px}.tabs{display:flex;gap:8px;margin:14px 0}.tab{background:#fff;color:#333;border:1px solid var(--line)}.tab.on{background:#2b2625;color:#fff}.panel{margin-bottom:15px}.form{display:none;background:var(--soft);border:1px solid #efdeda;padding:15px;border-radius:13px;margin:14px 0}.form.show{display:block}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:#756b67;margin-bottom:5px}.upload{border:2px dashed #dec5bf;padding:15px;border-radius:12px;background:#fff;text-align:center}.upload input{width:100%}.hint{font-size:11px;color:#777;margin-top:6px}.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}.g{position:relative;border:1px solid var(--line);padding:4px;border-radius:9px;background:#fff}.g img{width:100%;height:110px;object-fit:cover;border-radius:6px}.g button{position:absolute;right:6px;top:6px;border:0;border-radius:50%;background:#fff;color:#b33;width:25px;height:25px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.thumb{width:55px;height:65px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:5px}.search{max-width:320px;margin:10px 0}.toast{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;padding:12px 16px;border-radius:10px;display:none}.toast.show{display:block}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.gallery{grid-template-columns:repeat(2,1fr)}.login{width:100%}.login .input{flex:1;width:auto}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">ModestWear <span>BD</span></div><small>Update Fashion Mart • Admin Dashboard</small></div><div class="login"><input id="pw" class="input" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Login</button></div></header><div id="msg" class="msg">Login করে dashboard ব্যবহার করো।</div><section class="stats"><div class="stat"><small>Products</small><b id="pc">—</b></div><div class="stat"><small>Orders</small><b id="oc">—</b></div><div class="stat"><small>Pending</small><b id="pending">—</b></div><div class="stat"><small>Total Sales</small><b id="sales">—</b></div></section><div class="tabs"><button id="tp" class="btn tab on" onclick="showTab('p')">Products</button><button id="to" class="btn tab" onclick="showTab('o')">Orders</button></div><section id="productsPanel" class="panel"><button class="btn rose" onclick="openForm()">＋ Add Product</button><input id="ps" class="input search" placeholder="Search products..." oninput="renderProducts()"><div id="form" class="form"><h3 id="ft">Add Product</h3><div class="fields"><div><label>Product name</label><input id="name" class="input"></div><div><label>Category</label><select id="category" class="input"><option>3 Piece</option><option>2 Piece</option><option>1 Piece</option><option>Abaya</option><option>Offer</option></select></div><div><label>Sale price</label><input id="price" class="input" type="number"></div><div><label>Old price</label><input id="old" class="input" type="number"></div><div><label>Stock</label><input id="stock" class="input" type="number" value="10"></div><div><label>Cover image URL (optional)</label><input id="image" class="input" placeholder="https://..."></div><div class="full"><label>📸 Gallery থেকে সরাসরি ছবি upload</label><div class="upload"><input id="files" type="file" accept="image/*" multiple onchange="pick(this)"><div class="hint">সর্বোচ্চ ৬টি ছবি। প্রথম ছবিই cover। ছবি browser-এই resize/compress হবে।</div></div><div id="gallery" class="gallery"></div></div><div class="full"><label>Description</label><textarea id="desc" class="input" rows="4"></textarea></div></div><p><b id="count">0</b>/6 photos</p><button class="btn rose" onclick="save()">Save Product</button> <button class="btn" onclick="closeForm()">Cancel</button></div><div id="products" class="table"></div></section><section id="ordersPanel" class="panel" style="display:none"><div id="orders" class="table"></div></section></main><div id="toast" class="toast"></div><script>const API='https://telegram-monetag.onrender.com';let pass='',editing=null,items=[],orders=[],gallery=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function H(){return{'X-Admin-Password':pass,'Content-Type':'application/json'}}function note(x){$('msg').textContent=x}function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}async function login(){pass=$('pw').value.trim();if(!pass)return note('Password দাও।');refresh()}async function refresh(){try{let r=await fetch(API+'/api/fashion/admin/stats',{headers:H()});if(!r.ok)throw new Error('Password ভুল অথবা backend unavailable');let s=await r.json();$('pc').textContent=s.products;$('oc').textContent=s.orders;$('pending').textContent=s.pending;$('sales').textContent='৳'+Number(s.sales).toLocaleString('en-BD');let p=await fetch(API+'/api/fashion/admin/products',{headers:H()});items=(await p.json()).items||[];let o=await fetch(API+'/api/fashion/admin/orders',{headers:H()});orders=(await o.json()).items||[];renderProducts();renderOrders();note('✅ Admin logged in')}catch(e){note('❌ '+e.message)}}function showTab(x){$('productsPanel').style.display=x==='p'?'block':'none';$('ordersPanel').style.display=x==='o'?'block':'none';$('tp').classList.toggle('on',x==='p');$('to').classList.toggle('on',x==='o')}function openForm(p){editing=p?.id||null;gallery=(p?.gallery||[]).slice(0,6);if(!gallery.length&&p?.image)gallery=[p.image];$('form').classList.add('show');$('ft').textContent=editing?'Edit Product':'Add Product';$('name').value=p?.name||'';$('category').value=p?.category||'3 Piece';$('price').value=p?.price||'';$('old').value=p?.old_price||'';$('stock').value=p?.stock??10;$('image').value=p?.image||'';$('desc').value=p?.description||'';$('files').value='';renderGallery()}function closeForm(){editing=null;gallery=[];$('form').classList.remove('show')}function renderGallery(){$('gallery').innerHTML=gallery.map((x,i)=>'<div class="g"><img src="'+esc(x)+'"><button onclick="removeG('+i+')">×</button></div>').join('');$('count').textContent=gallery.length}function removeG(i){gallery.splice(i,1);renderGallery()}function resize(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,m=1200;if(Math.max(w,h)>m){if(w>h){h=Math.round(h*m/w);w=m}else{w=Math.round(w*m/h);h=m}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);ok(c.toDataURL('image/jpeg',.82))};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}async function pick(input){let fs=[...input.files].slice(0,6-gallery.length);note('⏳ ছবি প্রস্তুত হচ্ছে...');for(const f of fs){if(f.type.startsWith('image/'))try{gallery.push(await resize(f))}catch(e){}}input.value='';renderGallery();toast(gallery.length+'টি ছবি ready')}async function save(){const name=$('name').value.trim(),price=Number($('price').value),old=Number($('old').value||0),stock=Number($('stock').value||0);let g=gallery.slice(0,6),url=$('image').value.trim();if(url&&!g.includes(url))g.unshift(url);g=g.slice(0,6);const image=url||g[0]||'';if(!name||!price||!image)return note('❌ Name, price এবং অন্তত ১টি ছবি দাও');const b={name,category:$('category').value,price,old_price:old,stock,image,gallery:g,description:$('desc').value.trim()};try{note('⏳ Saving...');const u=editing?API+'/api/fashion/admin/products/'+editing:API+'/api/fashion/admin/products';const r=await fetch(u,{method:editing?'PUT':'POST',headers:H(),body:JSON.stringify(b)});if(!r.ok){let d=await r.json().catch(()=>({}));throw new Error(d.error||'save failed')}closeForm();await refresh();toast('✅ Product saved')}catch(e){note('❌ '+e.message)}}function renderProducts(){const q=($('ps').value||'').toLowerCase();const list=items.filter(p=>String(p.name).toLowerCase().includes(q));$('products').innerHTML='<table><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Gallery</th><th>Action</th></tr>'+list.map(p=>'<tr><td><img class="thumb" src="'+esc(p.image||'assets/reference-category.jpg')+'"></td><td><b>'+esc(p.name)+'</b><br><small>'+esc(p.description||'')+'</small></td><td>'+esc(p.category)+'</td><td>৳'+Number(p.price).toLocaleString('en-BD')+(p.old_price?' <s>৳'+Number(p.old_price).toLocaleString('en-BD')+'</s>':'')+'</td><td>'+p.stock+'</td><td>'+(p.gallery?.length||0)+' photos</td><td><div class="actions"><button class="btn" onclick="edit('+p.id+')">Edit</button><button class="btn danger" onclick="del('+p.id+')">Delete</button></div></td></tr>').join('')+'</table>'}function edit(id){const p=items.find(x=>Number(x.id)===Number(id));if(p)openForm(p)}async function del(id){if(!confirm('Product delete করবে?'))return;const r=await fetch(API+'/api/fashion/admin/products/'+id,{method:'DELETE',headers:H()});if(r.ok){toast('Deleted');refresh()}else note('❌ Delete failed')}function renderOrders(){$('orders').innerHTML='<table><tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>'+orders.map(o=>'<tr><td>#'+o.id+'</td><td><b>'+esc(o.customer)+'</b><br>'+esc(o.phone)+'<br>'+esc(o.address)+'</td><td>'+o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')+'</td><td>৳'+Number(o.total).toLocaleString('en-BD')+'</td><td><select class="input" onchange="status('+o.id+',this.value)">'+['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</table>'}async function status(id,s){const r=await fetch(API+'/api/fashion/admin/orders/'+id,{method:'PUT',headers:H(),body:JSON.stringify({status:s})});if(r.ok)refresh();else note('❌ Status update failed')}$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
