<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Update Fashion Mart</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;color:#171717;background:#fff}
body{padding-bottom:76px}.header{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}
.menu{font-size:33px;line-height:1;width:42px;cursor:pointer}.logo{height:55px;width:150px;object-fit:contain}.headicons{display:flex;gap:13px;align-items:center}.search{font-size:34px;line-height:1}.cart{font-size:32px;position:relative}.count{position:absolute;right:-4px;top:-5px;background:#111;color:#fff;width:19px;height:19px;border-radius:50%;font-size:11px;text-align:center;line-height:19px}
.hero{width:100%;height:390px;overflow:hidden;position:relative;background:#eee}.hero img{width:100%;height:100%;object-fit:cover}.heroText{position:absolute;left:0;bottom:20px;padding:0 18px;color:#fff;text-shadow:0 2px 8px #0008}.heroText b{font-size:28px}.heroText span{display:block;font-size:13px;margin-top:5px}
.whats{height:76px;background:#731332;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;gap:7px}.whats span{font-size:28px}.whats u{font-weight:800}
.categorySec{background:#b58b99;padding:18px 16px 11px}.title{display:flex;align-items:center;gap:12px;justify-content:center;color:#fff;font-size:25px;font-weight:800;margin:0 0 17px}.title:before,.title:after{content:"";height:2px;background:#fff;width:74px}.cats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cat{height:225px;border-radius:24px;overflow:hidden;background:#fff}.cat img{width:100%;height:100%;object-fit:cover}.dots{text-align:center;color:#fff;font-size:18px;letter-spacing:7px;height:25px;margin-top:7px}.dots i{font-style:normal}
.sec{padding:22px 16px 8px}.arrival{padding-top:40px}.blackTitle{display:flex;align-items:center;gap:12px;justify-content:center;font-size:30px;font-weight:900;text-align:center;line-height:1.05;margin-bottom:22px}.blackTitle:before,.blackTitle:after{content:"";height:2px;background:#222;width:76px}.products{display:grid;grid-template-columns:1fr 1fr;gap:13px}.product{border:1px solid #eee;border-radius:15px;overflow:hidden;background:#fff;position:relative;cursor:pointer}.pimg{height:245px;position:relative;background:#eee}.pimg img{width:100%;height:100%;object-fit:cover}.sale{position:absolute;right:7px;top:7px;background:#f25c00;color:#fff;border-radius:10px;padding:9px 8px;font-weight:800;font-size:14px}.pinfo{padding:10px}.pname{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pprice{font-size:17px;font-weight:900;margin-top:5px}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:5px}.order{width:100%;border:0;background:#111;color:#fff;padding:10px;border-radius:8px;margin-top:9px;font-weight:800}
.floatwa{position:fixed;right:16px;bottom:89px;width:70px;height:70px;background:#20d366;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:39px;z-index:25;box-shadow:0 4px 15px #0003;cursor:pointer}.bottom{height:76px;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);text-align:center}.bottom a{color:#222;text-decoration:none;padding-top:8px;font-weight:800;font-size:14px}.bi{font-size:27px;line-height:30px;display:block}.new{display:inline-block;background:#195184;color:#fff;border-radius:9px;padding:2px 8px;font-size:11px;vertical-align:middle;margin-left:2px}
.drawer{position:fixed;inset:0;background:#0008;z-index:40;display:none}.drawer.open{display:block}.drawerBox{width:82%;height:100%;background:#fff;padding:22px}.drawerBox h2{color:#731332}.drawerBox a{display:block;padding:16px 0;border-bottom:1px solid #eee;text-decoration:none;color:#222;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.modalBox{background:#fff;width:100%;max-width:500px;max-height:90vh;border-radius:18px;overflow:auto;position:relative}.close{position:absolute;right:9px;top:8px;width:40px;height:40px;border:0;border-radius:50%;font-size:25px;background:#fff;z-index:2}.mainImg{height:410px;width:100%;object-fit:contain;background:#f5f5f5}.mi{padding:18px}.thumbs{display:flex;gap:7px;overflow:auto;margin-top:13px}.thumbs img{width:65px;height:65px;object-fit:cover;border-radius:8px}.mi button{width:100%;background:#731332;color:#fff;border:0;border-radius:9px;padding:13px;font-weight:800;margin-top:14px}
@media(min-width:700px){body{max-width:520px;margin:auto;box-shadow:0 0 30px #0001}.bottom{max-width:520px;left:50%;transform:translateX(-50%)}.floatwa{right:calc(50% - 245px)}}
</style></head><body>
<header class="header"><div class="menu" onclick="openDrawer()">☰</div><img class="logo" src="assets/logo.svg" alt="Update Fashion Mart"><div class="headicons"><div class="search">⌕</div><div class="cart">🛒<span class="count" id="cartCount">0</span></div></div></header>
<div class="hero"><img src="assets/hero.svg" alt="Update Fashion Mart"><div class="heroText"><b>UPDATE FASHION MART</b><span>Where Elegance Meets Your Style</span></div></div>
<div class="whats">💬 WhatsApp: <u id="waTop">018XXXXXXXX</u></div>
<section class="categorySec"><div class="title">Shop By Category</div><div class="cats"><div class="cat"><img src="assets/floral.svg" alt="Floral Collection"></div><div class="cat"><img src="assets/gown.svg" alt="Elegant Gown"></div></div><div class="dots"><i>●</i> ● ●</div></section>
<section class="sec arrival" id="arrival"><div class="blackTitle">NEW ARRIVAL<br>COLLECTIONS</div><div class="products" id="products"></div></section>
<div class="floatwa" onclick="whatsapp()">◔</div>
<nav class="bottom"><a href="#"><span class="bi">⌂</span>Home</a><a href="#arrival"><span class="bi">☆</span>Arrival <span class="new">NEW</span></a><a href="#" onclick="cartMsg()"><span class="bi">🛒</span>Cart</a><a href="#" onclick="searchMsg()"><span class="bi">⌕</span>Search</a><a href="#" onclick="accountMsg()"><span class="bi">♙</span>Account</a></nav>
<div class="drawer" id="drawer" onclick="closeDrawer(event)"><div class="drawerBox" onclick="event.stopPropagation()"><h2>UPDATE FASHION MART</h2><a href="#">Home</a><a href="#arrival">New Arrival</a><a href="#">Categories</a><a href="#">Offers</a><a href="#">Contact</a></div></div>
<div class="modal" id="modal" onclick="closeModal(event)"><div class="modalBox" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button><img id="mainImg" class="mainImg"><div class="mi"><h2 id="mt"></h2><div id="md"></div><h3 id="mp"></h3><button id="modalOrder">Order on WhatsApp</button><div id="thumbs" class="thumbs"></div></div></div></div>
<script>
const demo=[{title:'Floral Premium Collection',price:1450,old:1700,discount:'-14%',desc:'Elegant floral fabric • Premium quality',cover:'assets/floral.svg',images:['assets/floral.svg']},{title:'White Elegant Gown',price:2850,old:3200,discount:'-11%',desc:'Premium • Flowing • Modest',cover:'assets/gown.svg',images:['assets/gown.svg']},{title:'Maroon Flow Dress',price:2250,old:2600,discount:'-13%',desc:'Graceful • Comfortable • Chic',cover:'assets/maroon.svg',images:['assets/maroon.svg']}];
function products(){try{let x=JSON.parse(localStorage.getItem('ufm_products'));return Array.isArray(x)&&x.length?x:demo}catch(e){return demo}}function money(n){return '৳ '+Number(n||0).toLocaleString('en-BD')}
function render(){let e=document.getElementById('products');e.innerHTML='';products().forEach((p,i)=>{let d=document.createElement('div');d.className='product';d.onclick=()=>openProduct(i);d.innerHTML='<div class="pimg"><img src="'+p.cover+'"><span class="sale">'+(p.discount||'-10%')+'</span></div><div class="pinfo"><div class="pname">'+p.title+'</div><div class="pprice">'+money(p.price)+' <span class="old">'+(p.old?money(p.old):'')+'</span></div><button class="order" onclick="event.stopPropagation();order('+i+')">ORDER NOW</button></div>';e.appendChild(d)})}
function openProduct(i){let p=products()[i];document.getElementById('mainImg').src=p.cover;document.getElementById('mt').textContent=p.title;document.getElementById('md').textContent=p.desc||'';document.getElementById('mp').textContent=money(p.price);document.getElementById('modalOrder').onclick=()=>order(i);let t=document.getElementById('thumbs');t.innerHTML='';(p.images||[p.cover]).forEach(s=>{let im=document.createElement('img');im.src=s;im.onclick=()=>document.getElementById('mainImg').src=s;t.appendChild(im)});document.getElementById('modal').classList.add('open')}
function closeModal(e){if(!e||e.target.id==='modal')document.getElementById('modal').classList.remove('open')}function order(i){let p=products()[i],s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');if(n)location.href='https://wa.me/'+n+'?text='+encodeURIComponent('Assalamu Alaikum, I want to order: '+p.title+' - '+money(p.price));else whatsapp()}
function whatsapp(){let s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');window.open(n?'https://wa.me/'+n:'https://wa.me/','_blank')}function openDrawer(){document.getElementById('drawer').classList.add('open')}function closeDrawer(e){if(!e||e.target.id==='drawer')document.getElementById('drawer').classList.remove('open')}function cartMsg(){alert('Cart is ready.')}function searchMsg(){alert('Search is ready.')}function accountMsg(){alert('Account is ready.')}render();
</script></body></html>
