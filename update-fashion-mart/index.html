<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModestWear BD</title><style>*{box-sizing:border-box}body{margin:0;background:#eee;color:#171414;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;background:#fff;min-height:100vh}.head{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:5}.menu{font-size:38px;border:0;background:none}.logo{position:absolute;left:50%;transform:translateX(-50%);font:32px Georgia,serif;white-space:nowrap}.logo span{color:#b87576}.icons{font-size:30px}.icons button{border:0;background:none;font-size:30px}.hero{height:345px;background:#f4e6de;overflow:hidden}.hero img{width:100%;height:100%;display:block;object-fit:cover}.cats{padding:16px 14px;border-bottom:1px solid #eee}.row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-bottom:5px}.row::-webkit-scrollbar{display:none}.cat{flex:0 0 130px;height:112px;border:1px solid #eadbd7;border-radius:13px;background:#fff;scroll-snap-align:start;text-align:center;color:#171414}.cat.active{border:2px solid #b87576}.cat .ico{font-size:42px;height:62px;line-height:62px;color:#684a48}.cat b{font-size:14px;font-weight:500}.section{padding:12px 14px 95px}.title{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px}.title h2{font:26px Georgia,serif;margin:0}.title a{color:#b87576;text-decoration:none;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #e7dedb;border-radius:12px;overflow:hidden;background:#fff}.pic{height:174px;background:#f3efeb;padding:6px;position:relative}.pic img{width:100%;height:100%;object-fit:cover;border-radius:7px}.heart{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:21px}.info{padding:9px}.name{font-size:15px;min-height:38px}.catname{font-size:12px;color:#777}.price{font-size:19px;font-weight:bold;color:#b87576;margin-top:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;height:74px;background:#fff;border-top:1px solid #e5dfdc;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav a{text-decoration:none;color:#222;text-align:center;font-size:12px;padding-top:7px}.nav a:first-child{color:#b87576;font-weight:bold}.nav i{display:block;font-style:normal;font-size:28px;line-height:31px}.wa{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:88px;width:54px;height:54px;border:0;border-radius:50%;background:#1da45b;color:#fff;font-size:24px;z-index:9}@media(max-width:520px){.logo{font-size:27px}.head{padding:0 14px}.hero{height:345px}.cat{flex-basis:130px}.grid{gap:10px}.pic{height:173px}}</style></head><body><main class="app"><header class="head"><button class="menu">☰</button><div class="logo">ModestWear <span>BD</span></div><div class="icons"><button>♡</button></div></header><section class="hero"><img src="data:image/jpeg;base64,REPLACE_HERO" alt="ModestWear BD hero"></section><section class="cats"><div class="row"><button class="cat active" onclick="show('Three Piece',this)"><div class="ico">♧</div><b>Three Piece</b></button><button class="cat" onclick="show('Two Piece',this)"><div class="ico">♧</div><b>Two Piece</b></button><button class="cat" onclick="show('One Piece',this)"><div class="ico">♧</div><b>One Piece</b></button><button class="cat" onclick="show('Borka',this)"><div class="ico">♧</div><b>Borka</b></button></div></section><section class="section" id="collection"><div class="title"><h2>Our Collection</h2><a href="#" onclick="show('all');return false">View All ›</a></div><div class="grid" id="grid"></div></section></main><button class="wa" onclick="order('')">◉</button><nav class="nav"><a href="#"><i>⌂</i>Home</a><a href="#collection"><i>▦</i>Categories</a><a href="#collection"><i>♡</i>Wishlist</a><a href="admin.html"><i>♙</i>Account</a></nav><script>const API='https://telegram-monetag.onrender.com';const seed=[['Sufia Three Piece','Three Piece',2490,'https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=700&q=85'],['Noor Two Piece','Two Piece',2290,'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=700&q=85'],['Ayesha One Piece','One Piece',2190,'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=700&q=85'],['Haya Borka','Borka',2790,'https://images.unsplash.com/photo-1591369822096-ffd140ec948f?auto=format&fit=crop&w=700&q=85']];let products=seed.map(x=>({name:x[0],cat:x[1],price:x[2],img:x[3]})),active='all';const money=n=>'৳ '+Number(n).toLocaleString('en-BD');function order(name){let n='8801XXXXXXXXX';try{n=(JSON.parse(localStorage.getItem('ufm_settings')||'{}').whatsapp||n).replace(/\D/g,'')}catch(e){}location.href='https://wa.me/'+n+(name?'?text='+encodeURIComponent('I want to order: '+name):'')}function render(){let a=products.filter(p=>active==='all'||p.cat===active);document.getElementById('grid').innerHTML=a.map(p=>`<article class="card"><div class="pic"><img src="${p.img}" alt="${p.name}"><button class="heart" onclick="this.textContent=this.textContent==='♡'?'♥':'♡'">♡</button></div><div class="info"><div class="name">${p.name}</div><div class="catname">${p.cat}</div><div class="price">${money(p.price)}</div></div></article>`).join('')}function show(cat,b){active=cat||'all';document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render();document.getElementById('collection').scrollIntoView({behavior:'smooth'})}async function load(){try{let r=await fetch(API+'/api/fashion/products?category=all',{cache:'no-store'});if(r.ok){let d=await r.json();(d.items||[]).forEach(x=>{let p=products.find(y=>y.name===x.name);if(p){p.price=x.price;p.img=(x.gallery&&x.gallery[0])||x.image_url||x.image||p.img}});render()}}catch(e){}}render();load();</script></body></html>
