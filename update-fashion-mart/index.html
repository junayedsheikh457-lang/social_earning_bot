<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff"><title>ModestWear BD</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#181515;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #0001}.head{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:5}.menu,.icon{border:0;background:none;font-size:28px}.logo{position:absolute;left:50%;transform:translateX(-50%);font:32px Georgia,serif;white-space:nowrap}.logo span{color:#b87576}.hero{height:345px;background:#f4e6de;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.cats{padding:16px 14px;border-bottom:1px solid #eee;overflow:hidden}.row{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-bottom:5px}.row::-webkit-scrollbar{display:none}.cat{flex:0 0 130px;scroll-snap-align:start;height:112px;border:1px solid #eadbd7;border-radius:12px;background:white;text-align:center;padding:12px}.cat.active{border:1.5px solid #b87576}.ico{font:42px Georgia;color:#684a48;line-height:44px}.cat b{font-size:14px}.section{padding:12px 14px 95px}.title{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px}.title h2{font:25px Georgia;margin:0}.title a{color:#b87576;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #e7dedb;border-radius:12px;overflow:hidden;position:relative}.pic{height:174px;background:#f3efeb;padding:6px}.pic img{width:100%;height:100%;object-fit:cover;border-radius:7px}.heart{position:absolute;right:9px;top:9px;width:35px;height:35px;border:1px solid #ddd;border-radius:50%;background:#fff;font-size:20px}.info{padding:10px}.name{font-size:15px;min-height:38px}.catname{font-size:12px;color:#777}.price{color:#b87576;font-size:19px;font-weight:bold;margin-top:6px}.order{width:100%;border:0;border-radius:7px;background:#292424;color:white;padding:9px;margin-top:8px;font-weight:bold}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;height:72px;background:white;border-top:1px solid #e7e0dd;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav a{text-decoration:none;color:#222;text-align:center;font-size:11px;padding-top:8px}.nav a:first-child{color:#b87576;font-weight:bold}.nav i{display:block;font-style:normal;font-size:27px;line-height:30px}.wa{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:88px;width:51px;height:51px;border:0;border-radius:50%;background:#1da45b;color:#fff;font-size:25px;z-index:9}@media(max-width:520px){.logo{font-size:28px}.hero{height:345px}.pic{height:173px}}
</style></head><body><main class="app"><header class="head"><button class="menu">☰</button><div class="logo">ModestWear <span>BD</span></div><div><button class="icon" onclick="location.hash='collection'">⌕</button><button class="icon">♡</button></div></header>
<section class="hero"><img id="heroImg" alt="ModestWear BD"></section>
<section class="cats"><div class="row"><button class="cat active" onclick="show('Three Piece',this)"><div class="ico">♧</div><b>Three Piece</b></button><button class="cat" onclick="show('Two Piece',this)"><div class="ico">♧</div><b>Two Piece</b></button><button class="cat" onclick="show('One Piece',this)"><div class="ico">♧</div><b>One Piece</b></button><button class="cat" onclick="show('Borka',this)"><div class="ico">♧</div><b>Borka</b></button></div></section>
<section class="section" id="collection"><div class="title"><h2>Our Collection</h2><a href="#" onclick="show('all');return false">View All ›</a></div><div class="grid" id="grid"></div></section></main>
<button class="wa" onclick="order('')">◉</button><nav class="nav"><a href="#">⌂<br>Home</a><a href="#collection">▦<br>Categories</a><a href="#collection">♡<br>Wishlist</a><a href="admin.html">♙<br>Account</a></nav>
<script>
const API='https://telegram-monetag.onrender.com';
const seed=[
{name:'Sufia Three Piece',cat:'Three Piece',price:2490,img:'https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=700&q=85'},
{name:'Noor Two Piece',cat:'Two Piece',price:2290,img:'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=700&q=85'},
{name:'Ayesha One Piece',cat:'One Piece',price:2190,img:'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=700&q=85'},
{name:'Haya Borka',cat:'Borka',price:2790,img:'https://images.unsplash.com/photo-1591369822096-ffd140ec948f?auto=format&fit=crop&w=700&q=85'}];
let products=seed,active='all';
function money(n){return '৳ '+Number(n).toLocaleString('en-BD')}
function order(name){let n='8801XXXXXXXXX';try{n=(JSON.parse(localStorage.getItem('ufm_settings')||'{}').whatsapp||n).replace(/\D/g,'')}catch(e){}location.href='https://wa.me/'+n+(name?'?text='+encodeURIComponent('I want to order: '+name):'')}
function render(){let q=(document.getElementById('q')?.value||'').toLowerCase();let a=products.filter(p=>(active==='all'||p.cat===active)&&(!q||p.name.toLowerCase().includes(q)));document.getElementById('grid').innerHTML=a.map(p=>`<article class="card"><div class="pic"><img src="${p.img}" alt="${p.name}"><button class="heart" onclick="this.textContent=this.textContent==='♡'?'♥':'♡'">♡</button></div><div class="info"><div class="name">${p.name}</div><div class="catname">${p.cat}</div><div class="price">${money(p.price)}</div><button class="order" onclick="order('${p.name.replace(/'/g,"\\'")}')">ORDER NOW</button></div></article>`).join('')}
function show(cat,b){active=cat;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render();location.hash='collection'}
async function load(){try{let r=await fetch(API+'/api/fashion/products?category=all',{cache:'no-store'});if(r.ok){let d=await r.json();let remote=d.items||[];products=seed.map(s=>{let x=remote.find(p=>p.name===s.name);return x?{...s,price:x.price,img:(x.gallery&&x.gallery[0])||x.image_url||x.image||s.img}:s});render()}}catch(e){}}
render();load();
const hi=document.getElementById('heroImg');fetch('hero.b64',{cache:'no-store'}).then(r=>r.text()).then(b=>hi.src='data:image/webp;base64,'+b.trim()).catch(()=>hi.src='hero.jpg');</script></body></html>
