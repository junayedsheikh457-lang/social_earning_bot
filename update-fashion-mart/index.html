<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Fashion Mart</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#181818;font-family:Arial,sans-serif}body{padding-bottom:76px}.head{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:10}.menu{font-size:35px}.logo{width:125px;height:62px;object-fit:contain}.icons{display:flex;gap:17px;font-size:36px;align-items:center}.cart{font-size:30px;position:relative}.count{position:absolute;right:-6px;top:-6px;background:#111;color:#fff;border-radius:50%;width:21px;height:21px;text-align:center;font-size:11px;line-height:21px}.hero{width:100%;aspect-ratio:860/480;overflow:hidden;background:#f4eee6}.hero img{width:100%;height:100%;display:block;object-fit:cover}.wa{height:78px;background:#741337;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:800}.wa u{font-size:19px}.arrival{padding:30px 15px 20px}.heading{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:27px;line-height:1.03;margin:0 0 20px;font-weight:900}.heading:before,.heading:after{content:"";height:2px;width:64px;background:#222}.products{display:grid;grid-template-columns:1fr 1fr;gap:13px}.product{border:1px solid #e5e5e5;border-radius:15px;overflow:hidden;background:#fff}.pimg{height:245px;background:#f3f3f3;position:relative}.pimg img{width:100%;height:100%;object-fit:cover}.sale{position:absolute;right:7px;top:7px;background:#f15d00;color:#fff;border-radius:9px;padding:8px;font-weight:800;font-size:13px}.info{padding:10px}.name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:17px;font-weight:900;margin-top:5px}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:4px}.order{width:100%;margin-top:9px;padding:10px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:800}.category{background:#b58c9a;padding:20px 15px 10px}.category .heading{color:#fff;margin-bottom:18px}.category .heading:before,.category .heading:after{background:#fff}.cats{display:grid;grid-template-columns:1fr 1fr;gap:13px}.cat{aspect-ratio:1;border-radius:22px;overflow:hidden;background:#fff}.cat img{width:100%;height:100%;object-fit:cover;display:block}.dots{text-align:center;color:#fff;font-size:18px;letter-spacing:7px;margin:6px 0}.float{position:fixed;right:15px;bottom:91px;width:70px;height:70px;border-radius:50%;background:#20d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;z-index:15}.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;z-index:20}.bottom a{color:#222;text-decoration:none;font-weight:800;font-size:14px;padding-top:7px}.bi{display:block;font-size:28px;line-height:31px}.new{display:inline-block;background:#195184;color:#fff;border-radius:10px;padding:2px 8px;font-size:10px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;padding:14px}.modal.open{display:flex}.box{background:#fff;width:100%;max-height:90vh;border-radius:18px;overflow:auto;position:relative}.close{position:absolute;right:8px;top:8px;border:0;border-radius:50%;background:#fff;width:40px;height:40px;font-size:25px;z-index:2}.main{width:100%;height:410px;object-fit:contain;background:#f5f5f5}.details{padding:17px}.details button{width:100%;border:0;border-radius:9px;background:#741337;color:#fff;padding:13px;font-weight:800;margin-top:12px}.thumbs{display:flex;gap:7px;overflow:auto;margin-top:12px}.thumbs img{width:67px;height:67px;object-fit:cover;border-radius:8px}@media(min-width:700px){body{max-width:520px;margin:auto;box-shadow:0 0 30px #0001}.bottom{max-width:520px;left:50%;right:auto;width:520px;transform:translateX(-50%)}.float{right:calc(50% - 245px)}}</style></head><body><header class="head"><div class="menu">☰</div><img class="logo" src="assets/logo.svg"><div class="icons"><span>⌕</span><span class="cart">🛒<i class="count">0</i></span></div></header><section class="hero"><img src="assets/hero.svg" alt="Update Fashion Mart"></section><div class="wa">💬 WhatsApp: <u id="wa">018XXXXXXXX</u></div><section class="arrival" id="arrival"><h2 class="heading">NEW ARRIVAL<br>COLLECTIONS</h2><div class="products" id="products"></div></section><section class="category"><h2 class="heading">Shop By Category</h2><div class="cats"><div class="cat"><img src="assets/floral.svg"></div><div class="cat"><img src="assets/gown.svg"></div></div><div class="dots">● ● ●</div></section><div class="float" onclick="whatsapp()">◔</div><nav class="bottom"><a href="#"><span class="bi">⌂</span>Home</a><a href="#arrival"><span class="bi">☆</span>Arrival <span class="new">NEW</span></a><a href="#"><span class="bi">🛒</span>Cart</a><a href="#"><span class="bi">⌕</span>Search</a><a href="#"><span class="bi">♙</span>Account</a></nav><div class="modal" id="modal" onclick="closeM(event)"><div class="box" onclick="event.stopPropagation()"><button class="close" onclick="closeM()">×</button><img id="main" class="main"><div class="details"><h2 id="mn"></h2><p id="md"></p><h3 id="mp"></h3><button id="buy">ORDER ON WHATSAPP</button><div id="thumbs" class="thumbs"></div></div></div></div><script>const demo=[{title:'Floral Premium Collection',price:1450,old:1700,discount:'-14%',desc:'Elegant floral fabric • Premium quality',cover:'assets/floral.svg',images:['assets/floral.svg']},{title:'White Elegant Gown',price:2850,old:3200,discount:'-11%',desc:'Premium • Flowing • Modest',cover:'assets/gown.svg',images:['assets/gown.svg']},{title:'Maroon Flow Dress',price:2250,old:2600,discount:'-13%',desc:'Graceful • Comfortable • Chic',cover:'assets/maroon.svg',images:['assets/maroon.svg']}];function ps(){try{let x=JSON.parse(localStorage.getItem('ufm_products'));return Array.isArray(x)&&x.length?x:demo}catch(e){return demo}}function money(n){return'৳ '+Number(n||0).toLocaleString('en-BD')}function render(){let e=document.getElementById('products');e.innerHTML='';ps().forEach((p,i)=>{let d=document.createElement('article');d.className='product';d.onclick=()=>openP(i);d.innerHTML='<div class="pimg"><img src="'+p.cover+'"><span class="sale">'+(p.discount||'-10%')+'</span></div><div class="info"><div class="name">'+p.title+'</div><div class="price">'+money(p.price)+' <span class="old">'+(p.old?money(p.old):'')+'</span></div><button class="order" onclick="event.stopPropagation();order('+i+')">ORDER NOW</button></div>';e.appendChild(d)})}function openP(i){let p=ps()[i];main.src=p.cover;mn.textContent=p.title;md.textContent=p.desc||'';mp.textContent=money(p.price);buy.onclick=()=>order(i);thumbs.innerHTML='';(p.images||[p.cover]).forEach(s=>{let x=document.createElement('img');x.src=s;x.onclick=()=>main.src=s;thumbs.appendChild(x)});modal.classList.add('open')}function closeM(e){if(!e||e.target.id==='modal')modal.classList.remove('open')}function order(i){let p=ps()[i],s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');window.open(n?'https://wa.me/'+n+'?text='+encodeURIComponent('Assalamu Alaikum, I want to order: '+p.title+' - '+money(p.price)):'https://wa.me/','_blank')}function whatsapp(){let s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');window.open(n?'https://wa.me/'+n:'https://wa.me/','_blank')}let s=JSON.parse(localStorage.getItem('ufm_settings')||'{}');if(s.whatsapp)wa.textContent=s.whatsapp;render();</script></body></html>
