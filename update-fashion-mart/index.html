<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Update Fashion Mart</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}body{padding-bottom:82px;overflow-x:hidden}.wrap{width:100%;max-width:none;margin:auto}.shot{position:relative;width:100%;line-height:0}.shot img{display:block;width:100%;height:auto}.hot{position:absolute;background:transparent;border:0;cursor:pointer}.menu{left:3%;top:7%;width:14%;height:43%}.search{right:15%;top:7%;width:13%;height:43%}.cart{right:1%;top:7%;width:13%;height:43%}.wa{left:18%;top:0;width:65%;height:100%}.cats{left:4%;bottom:0;width:92%;height:43%}
.arrival{padding:30px 18px 24px;background:#fff}.title{display:flex;align-items:center;justify-content:center;gap:18px;font-size:30px;font-weight:900;line-height:1.05;margin:0 0 24px;text-align:center}.title:before,.title:after{content:"";height:2px;background:#111;width:74px;flex:0 0 74px}.products{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.product{border:1px solid #d8d8d8;border-radius:17px;overflow:hidden;background:#fff;box-shadow:0 1px 4px #00000010;min-width:0}.product-media{width:100%;height:720px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;overflow:hidden}.product-media img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{font-size:58px;color:#10263c}.info{padding:11px 12px 14px}.name{font-weight:800;font-size:14px;line-height:1.25;min-height:35px}.price{font-size:18px;font-weight:900;margin-top:6px}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:4px}.order{width:100%;border:0;background:#10263c;color:#fff;padding:12px;border-radius:11px;margin-top:10px;font-weight:900;font-size:16px}.empty{grid-column:1/-1;padding:35px 10px;text-align:center;color:#666}
.bottom{position:fixed;bottom:0;left:0;right:0;height:82px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);z-index:50;text-align:center}.bottom a{color:#222;text-decoration:none;font-weight:800;font-size:14px;padding-top:7px}.bi{display:block;font-size:29px;line-height:34px}.new{display:inline-block;background:#195184;color:#fff;border-radius:11px;padding:2px 9px;font-size:10px}.float{position:fixed;right:18px;bottom:96px;width:64px;height:64px;border-radius:50%;border:0;background:#20d366;color:#fff;font-size:34px;z-index:55}.drawer{display:none;position:fixed;inset:0;background:#0008;z-index:80}.drawer.open{display:block}.panel{width:285px;max-width:82%;height:100%;background:#fff;padding:22px}.panel a{display:block;padding:16px 4px;border-bottom:1px solid #eee;color:#111;text-decoration:none;font-weight:700}.searchbox{display:none;position:fixed;top:0;left:0;right:0;background:#fff;padding:15px;z-index:70;border-bottom:1px solid #ddd}.searchbox.open{display:block}.searchbox input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}
</style></head><body><main class="wrap"><div class="shot"><img src="https://raw.githubusercontent.com/junayedsheikh457-lang/social_earning_bot/main/update-fashion-mart/assets/reference-header.jpg" alt="Update Fashion Mart header"><button class="hot menu" onclick="openMenu()"></button><button class="hot search" onclick="openSearch()"></button><button class="hot cart" onclick="cart()"></button></div><div class="shot"><img src="https://raw.githubusercontent.com/junayedsheikh457-lang/social_earning_bot/main/update-fashion-mart/assets/reference-hero.jpg" alt="Update Fashion Mart hero"></div><div class="shot"><img src="https://raw.githubusercontent.com/junayedsheikh457-lang/social_earning_bot/main/update-fashion-mart/assets/reference-category.jpg" alt="WhatsApp and Shop By Category"><button class="hot wa" onclick="whatsapp()"></button><a class="hot cats" href="#arrival"></a></div><section class="arrival" id="arrival"><h2 class="title">NEW ARRIVAL<br>COLLECTIONS</h2><div class="products" id="products"></div></section></main><button class="float" onclick="whatsapp()">◔</button><nav class="bottom"><a href="#"><span class="bi">⌂</span>Home</a><a href="#arrival"><span class="bi">☆</span>Arrival <span class="new">NEW</span></a><a href="#" onclick="cart();return false"><span class="bi">🛒</span>Cart</a><a href="#" onclick="openSearch();return false"><span class="bi">⌕</span>Search</a><a href="admin.html"><span class="bi">♙</span>Account</a></nav><div class="drawer" id="drawer" onclick="closeMenu(event)"><div class="panel" onclick="event.stopPropagation()"><a href="#" onclick="closeMenu()">Home</a><a href="#arrival" onclick="closeMenu()">New Arrivals</a><a href="#" onclick="openSearch();closeMenu();return false">Search</a><a href="admin.html">Account / Admin</a><a href="#" onclick="whatsapp();return false">WhatsApp Order</a></div></div><div class="searchbox" id="searchbox"><input id="q" placeholder="Search collections..." oninput="filter(this.value)"></div><script>
const demo=[{title:'Floral Premium Collection',price:1450,old:1700,img:'https://raw.githubusercontent.com/junayedsheikh457-lang/social_earning_bot/main/update-fashion-mart/assets/reference-category.jpg'},{title:'Classic Borka Collection',price:1850,old:2200,img:'https://raw.githubusercontent.com/junayedsheikh457-lang/social_earning_bot/main/update-fashion-mart/assets/reference-category.jpg'},{title:'Premium Fashion Collection',price:2250,old:2600,img:'https://raw.githubusercontent.com/junayedsheikh457-lang/social_earning_bot/main/update-fashion-mart/assets/reference-hero.jpg'}];
function products(){try{const p=JSON.parse(localStorage.getItem('ufm_products'));return Array.isArray(p)&&p.length?p:demo}catch(e){return demo}}
function money(n){const v=Number(n);return Number.isFinite(v)?'৳ '+v.toLocaleString('en-BD'):'৳ 0'}
function safe(v,f=''){return typeof v==='string'&&v.trim()?v:f}
function render(a){const box=document.getElementById('products');if(!a.length){box.innerHTML='<div class="empty">No products found.</div>';return}box.innerHTML=a.map((p,i)=>{const title=safe(p.title,safe(p.name,'Fashion Collection'));const src=safe(p.cover,safe(p.img,'https://raw.githubusercontent.com/junayedsheikh457-lang/social_earning_bot/main/update-fashion-mart/assets/reference-category.jpg'));const price=Number.isFinite(Number(p.price))?Number(p.price):0;const old=Number.isFinite(Number(p.old))?Number(p.old):0;return `<article class="product"><div class="product-media"><img src="${src}" alt="${title}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class="placeholder">UFM</div>'"></div><div class="info"><div class="name">${title}</div><div class="price">${money(price)} ${old?`<span class="old">${money(old)}</span>`:''}</div><button class="order" onclick="order(${i})">ORDER NOW</button></div></article>`}).join('')}
function filter(q){q=(q||'').toLowerCase();render(products().filter(p=>(safe(p.title,safe(p.name,''))+' '+safe(p.desc,'')).toLowerCase().includes(q)))}
function number(){const s=JSON.parse(localStorage.getItem('ufm_settings')||'{}');return safe(s.whatsapp,'').replace(/\D/g,'')}
function order(i){const p=products()[i];const n=number();const title=safe(p.title,safe(p.name,'Fashion Collection'));const url=n?'https://wa.me/'+n+'?text='+encodeURIComponent('I want to order: '+title+' - '+money(p.price)):'https://wa.me/';window.open(url,'_blank')}
function whatsapp(){const n=number();window.open(n?'https://wa.me/'+n:'https://wa.me/','_blank')}
function cart(){alert('Cart / order area')}
function openMenu(){drawer.classList.add('open')}function closeMenu(e){if(!e||e.target.id==='drawer')drawer.classList.remove('open')}
function openSearch(){searchbox.classList.toggle('open');if(searchbox.classList.contains('open'))setTimeout(()=>q.focus(),50)}
const productsBox=document.getElementById('products');render(products());
</script></body></html>
