<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Update Fashion Mart</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;font-family:Arial,sans-serif;color:#111}body{padding-bottom:82px}.wrap{max-width:760px;margin:auto;background:#fff;overflow:hidden}.top{height:122px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:relative}.hamb{font-size:44px;border:0;background:none}.acts{display:flex;gap:22px;font-size:40px}.logo{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:102px;height:102px;border-radius:50%;background:#070707;border:5px solid #fff;color:#d5aa57;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}.logo b{font:700 27px Georgia}.logo span{font-size:7px;letter-spacing:2px;color:#fff}.hero{width:100%;background:#071d31;line-height:0}.hero img{width:100%;height:auto;display:block;object-fit:cover}.wa{height:88px;background:#94133f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800}.wa button{border:0;background:none;color:#fff;text-decoration:underline;font:inherit;margin-left:7px}.cat{background:#c99eaf;padding:28px 22px 22px}.ct{color:#fff;font-size:29px;font-weight:800;text-align:center;margin-bottom:24px;display:flex;align-items:center;gap:16px}.ct:before,.ct:after{content:"";height:3px;background:#fff;flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border-radius:22px;overflow:hidden;background:#f8f4ef;aspect-ratio:1/1.05;position:relative;text-decoration:none;color:#111}.card img{width:100%;height:100%;object-fit:cover;display:block}.fake{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font:700 22px Georgia;color:#765329}.dots{text-align:center;color:#fff;font-size:23px;letter-spacing:6px;margin-top:10px}.arr{padding:32px 18px;background:#fff}.title{font-size:32px;font-weight:900;line-height:1.03;text-align:center;display:flex;gap:15px;align-items:center;margin:0 0 24px}.title:before,.title:after{content:"";height:3px;background:#111;flex:1}.products{display:grid;grid-template-columns:1fr 1fr;gap:14px}.p{border:1px solid #ddd;border-radius:18px;overflow:hidden;background:#fff}.pm{height:390px;background:#eee}.pm img{width:100%;height:100%;object-fit:cover}.pi{padding:12px}.pn{font-size:19px;font-weight:800;min-height:48px}.price{font-size:24px;font-weight:900;margin-top:6px}.old{text-decoration:line-through;color:#888;font-size:15px;margin-left:6px}.order{width:100%;margin-top:10px;border:0;border-radius:12px;background:#10283e;color:#fff;font-weight:900;font-size:18px;padding:12px}.nav{position:fixed;bottom:0;left:0;right:0;height:82px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);z-index:10;text-align:center}.nav a{color:#111;text-decoration:none;font-weight:800;font-size:14px;padding-top:6px}.ico{display:block;font-size:30px;line-height:34px}.new{background:#1c5687;color:#fff;border-radius:12px;padding:2px 8px;font-size:10px}.float{position:fixed;right:18px;bottom:96px;width:62px;height:62px;border:0;border-radius:50%;background:#20d366;color:#fff;font-size:32px;z-index:11}.drawer{display:none;position:fixed;inset:0;background:#0008;z-index:20}.drawer.open{display:block}.panel{width:285px;max-width:82%;height:100%;background:#fff;padding:22px}.panel a{display:block;padding:16px 4px;border-bottom:1px solid #eee;color:#111;text-decoration:none;font-weight:700}.search{display:none;position:fixed;top:0;left:0;right:0;background:#fff;padding:14px;z-index:30}.search.open{display:block}.search input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:17px}@media(max-width:520px){.top{height:112px}.logo{width:92px;height:92px}.hero img{min-height:210px;object-fit:cover}.wa{height:76px;font-size:21px}.ct{font-size:24px}.pm{height:330px}.title{font-size:28px}}</style></head><body><main class="wrap"><header class="top"><button class="hamb" onclick="menu()">☰</button><div class="logo"><b>UFM</b><span>UPDATE</span><span>FASHION MART</span></div><div class="acts"><button onclick="searchBox()">⌕</button><button onclick="cart()">🛒</button></div></header><section class="hero"><img src="assets/reference-hero.jpg" alt="Update Fashion Mart Hero" onerror="this.style.display='none'"></section><section class="wa">◉ WhatsApp:<button onclick="wa()">018XXXXXXX</button></section><section class="cat"><div class="ct">Shop By Category</div><div class="grid"><a class="card" href="#arrival"><div class="fake">EMBROIDERY<br>BORKA</div></a><a class="card" href="#arrival"><div class="fake">CLASSIC<br>BORKA</div></a></div><div class="dots">● ● ○</div></section><section class="arr" id="arrival"><h2 class="title">NEW ARRIVAL<br>COLLECTIONS</h2><div class="products" id="products"></div></section></main><button class="float" onclick="wa()">◔</button><nav class="nav"><a href="#"><span class="ico">⌂</span>Home</a><a href="#arrival"><span class="ico">☆</span>Arrival <span class="new">NEW</span></a><a href="#" onclick="cart();return false"><span class="ico">🛒</span>Cart</a><a href="#" onclick="searchBox();return false"><span class="ico">⌕</span>Search</a><a href="admin.html"><span class="ico">♙</span>Account</a></nav><div class="drawer" id="drawer" onclick="closeMenu(event)"><div class="panel" onclick="event.stopPropagation()"><a href="#">Home</a><a href="#arrival">New Arrivals</a><a href="#" onclick="searchBox();closeMenu();return false">Search</a><a href="admin.html">Account / Admin</a><a href="#" onclick="wa();return false">WhatsApp Order</a></div></div><div class="search" id="search"><input placeholder="Search collections..." oninput="filter(this.value)"></div><script>const demo=[{title:"Floral Premium Collection",price:1450,old:1700,img:"assets/reference-category.jpg"},{title:"Classic Borka Collection",price:1850,old:2200,img:"assets/reference-category.jpg"}];function data(){try{let x=JSON.parse(localStorage.getItem("ufm_products"));return Array.isArray(x)&&x.length?x:demo}catch(e){return demo}}function s(v,f){return v!=null&&String(v).trim()?String(v):f}function money(n){return"৳ "+(Number(n)||0).toLocaleString("en-BD")}function render(a){products.innerHTML=a.map((p,i)=>{p=p||{};let t=s(p.title,s(p.name,"Fashion Collection")),im=s(p.cover,s(p.img,"assets/reference-category.jpg"));return`<article class="p"><div class="pm"><img src="${im}" alt="" onerror="this.style.display='none'"></div><div class="pi"><div class="pn">${t}</div><div class="price">${money(p.price)} ${p.old?`<span class="old">${money(p.old)}</span>`:""}</div><button class="order" onclick="order(${i})">ORDER NOW</button></div></article>`}).join("")}function filter(q){q=(q||"").toLowerCase();render(data().filter(p=>s(p.title,s(p.name,"")).toLowerCase().includes(q)))}function num(){try{return s(JSON.parse(localStorage.getItem("ufm_settings")||"{}").whatsapp,"").replace(/\D/g,"")}catch(e){return""}}function wa(){let n=num();location.href=n?"https://wa.me/"+n:"https://wa.me/"}function order(i){let p=data()[i]||{},n=num(),t=s(p.title,s(p.name,"Fashion Collection"));location.href=n?"https://wa.me/"+n+"?text="+encodeURIComponent("I want to order: "+t+" - "+money(p.price)):"https://wa.me/"}function cart(){alert("Cart / order area")}function menu(){drawer.classList.add("open")}function closeMenu(e){if(!e||e.target.id==="drawer")drawer.classList.remove("open")}function searchBox(){search.classList.toggle("open")}render(data());</script></body></html>
