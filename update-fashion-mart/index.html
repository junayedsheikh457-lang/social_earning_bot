<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Update Fashion Mart</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#151515;font-family:Arial,Helvetica,sans-serif}body{padding-bottom:82px;overflow-x:hidden}
:root{--navy:#10263c;--gold:#c79a45;--cream:#fff9ed;--wine:#741337;--mauve:#b88f9d}
.header{height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:30}.hamb{width:45px;height:45px;border:0;background:transparent;font-size:35px;line-height:1;cursor:pointer;color:#111}.brand{width:108px;height:62px;object-fit:contain}.head-actions{display:flex;align-items:center;gap:17px}.search-btn,.cart-btn{border:0;background:transparent;cursor:pointer;position:relative;color:#111}.search-btn{font-size:39px;line-height:1}.cart-btn{font-size:30px}.count{position:absolute;right:-7px;top:-7px;background:#111;color:#fff;width:21px;height:21px;border-radius:50%;font-size:11px;line-height:21px;font-style:normal;text-align:center}
.hero{width:100%;background:var(--navy);overflow:hidden}.hero img{display:block;width:100%;height:auto;aspect-ratio:860/480;object-fit:cover}
.wa{height:82px;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:800;letter-spacing:.1px}.wa-icon{font-size:28px}.wa u{font-size:21px;cursor:pointer}
.category{background:var(--mauve);padding:30px 16px 17px}.section-title{display:flex;align-items:center;justify-content:center;gap:20px;color:#fff;text-align:center;font-size:31px;line-height:1.08;margin:0 0 25px;font-weight:900}.section-title:before,.section-title:after{content:"";width:76px;height:2px;background:#fff;flex:0 0 auto}.cat-scroller{display:flex;gap:16px;overflow:hidden;scroll-snap-type:x mandatory}.cat{flex:0 0 calc(50% - 8px);aspect-ratio:1;border-radius:25px;overflow:hidden;background:#f8f5ef;box-shadow:0 5px 18px #0001;scroll-snap-align:start}.cat img{width:100%;height:100%;display:block;object-fit:cover}.dots{display:flex;justify-content:center;gap:18px;margin:17px 0 0}.dot{width:11px;height:11px;border-radius:50%;background:#fff;opacity:.95}.dot.active{box-shadow:0 0 0 2px #fff;background:transparent}
.arrival{padding:34px 16px 20px;background:#fff}.arrival .section-title{color:#111;margin-bottom:25px}.arrival .section-title:before,.arrival .section-title:after{background:#111}.products{display:grid;grid-template-columns:1fr 1fr;gap:14px}.product{border:1px solid #e7e3df;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 3px 12px #0000000a;cursor:pointer}.pimg{height:230px;background:#f3f0eb;position:relative}.pimg img{width:100%;height:100%;display:block;object-fit:cover}.sale{position:absolute;right:8px;top:8px;background:var(--wine);color:#fff;border-radius:9px;padding:6px 8px;font-weight:800;font-size:12px}.info{padding:11px}.name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:17px;font-weight:900;margin-top:5px}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:4px}.order{width:100%;margin-top:9px;padding:10px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}
.float{position:fixed;right:16px;bottom:94px;width:68px;height:68px;border-radius:50%;background:#20d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:35px;z-index:35;box-shadow:0 6px 20px #0003;cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;height:82px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;z-index:40}.bottom a{color:#222;text-decoration:none;font-weight:800;font-size:14px;padding-top:7px}.bi{display:block;font-size:29px;line-height:34px}.new{display:inline-block;background:#195184;color:#fff;border-radius:11px;padding:2px 9px;font-size:10px;margin-top:1px}
.drawer{position:fixed;inset:0;background:#0008;z-index:60;display:none}.drawer.open{display:block}.drawer-panel{width:285px;max-width:82%;height:100%;background:#fff;padding:24px 20px;box-shadow:5px 0 20px #0003}.drawer-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:15px}.drawer-logo{width:100px}.drawer-close{border:0;background:none;font-size:32px}.drawer a{display:block;color:#222;text-decoration:none;padding:17px 5px;border-bottom:1px solid #eee;font-weight:700}
.searchbar{display:none;position:fixed;top:72px;left:0;right:0;background:#fff;padding:12px 15px;border-bottom:1px solid #ddd;z-index:29}.searchbar.open{display:block}.searchbar input{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px 15px;font-size:16px;outline:none}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:80;align-items:center;padding:14px}.modal.open{display:flex}.box{background:#fff;width:100%;max-height:91vh;border-radius:18px;overflow:auto;position:relative}.close{position:absolute;right:8px;top:8px;border:0;border-radius:50%;background:#fff;width:40px;height:40px;font-size:25px;z-index:2}.main{width:100%;height:400px;object-fit:contain;background:#f5f5f5}.details{padding:17px}.details h2{margin:0 0 7px}.details p{color:#666}.details h3{font-size:22px}.details button{width:100%;border:0;border-radius:9px;background:var(--wine);color:#fff;padding:13px;font-weight:800;margin-top:12px}.thumbs{display:flex;gap:7px;overflow:auto;margin-top:12px}.thumbs img{width:67px;height:67px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
@media(min-width:700px){body{max-width:520px;margin:auto;box-shadow:0 0 30px #0001}.bottom{max-width:520px;left:50%;right:auto;width:520px;transform:translateX(-50%)}.float{right:calc(50% - 245px)}.searchbar{max-width:520px;left:50%;right:auto;width:520px;transform:translateX(-50%)}}
</style>
</head>
<body>
<header class="header">
<button class="hamb" onclick="openDrawer()" aria-label="Menu">☰</button>
<img class="brand" src="assets/logo.svg" alt="UFM Update Fashion Mart">
<div class="head-actions"><button class="search-btn" onclick="toggleSearch()" aria-label="Search">⌕</button><button class="cart-btn" onclick="goCart()" aria-label="Cart">🛒<i class="count" id="cartCount">0</i></button></div>
</header>
<div class="searchbar" id="searchbar"><input id="searchInput" type="search" placeholder="Search collections..." oninput="filterProducts(this.value)"></div>
<section class="hero"><img src="assets/hero.svg" alt="Update Fashion Mart collection"></section>
<div class="wa"><span class="wa-icon">◉</span> WhatsApp: <u id="wa" onclick="whatsapp()">018XXXXXXXX</u></div>
<section class="category">
<h2 class="section-title">Shop By Category</h2>
<div class="cat-scroller" id="catScroller">
<div class="cat"><img src="assets/floral.svg" alt="Embroidery Borka"></div>
<div class="cat"><img src="assets/gown.svg" alt="Classic Borka"></div>
<div class="cat"><img src="assets/maroon.svg" alt="Premium Collection"></div>
</div>
<div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
</section>
<section class="arrival" id="arrival">
<h2 class="section-title">NEW ARRIVAL<br>COLLECTIONS</h2>
<div class="products" id="products"></div>
</section>
<button class="float" onclick="whatsapp()" aria-label="WhatsApp">◔</button>
<nav class="bottom">
<a href="#"><span class="bi">⌂</span>Home</a>
<a href="#arrival"><span class="bi">☆</span>Arrival <span class="new">NEW</span></a>
<a href="#" onclick="goCart();return false"><span class="bi">🛒</span>Cart</a>
<a href="#" onclick="toggleSearch();return false"><span class="bi">⌕</span>Search</a>
<a href="admin.html"><span class="bi">♙</span>Account</a>
</nav>
<div class="drawer" id="drawer" onclick="closeDrawer(event)"><aside class="drawer-panel" onclick="event.stopPropagation()"><div class="drawer-top"><img class="drawer-logo" src="assets/logo.svg"><button class="drawer-close" onclick="closeDrawer()">×</button></div><a href="#" onclick="closeDrawer()">Home</a><a href="#arrival" onclick="closeDrawer()">New Arrivals</a><a href="#" onclick="toggleSearch();closeDrawer();return false">Search Products</a><a href="admin.html">Account / Admin</a><a href="#" onclick="whatsapp();return false">WhatsApp Order</a></aside></div>
<div class="modal" id="modal" onclick="closeM(event)"><div class="box" onclick="event.stopPropagation()"><button class="close" onclick="closeM()">×</button><img id="main" class="main"><div class="details"><h2 id="mn"></h2><p id="md"></p><h3 id="mp"></h3><button id="buy">ORDER ON WHATSAPP</button><div id="thumbs" class="thumbs"></div></div></div></div>
<script>
const demo=[
{title:'Floral Premium Collection',price:1450,old:1700,discount:'-14%',desc:'Elegant floral fabric • Premium quality',cover:'assets/floral.svg',images:['assets/floral.svg']},
{title:'Classic White Elegant Gown',price:2850,old:3200,discount:'-11%',desc:'Premium • Flowing • Modest',cover:'assets/gown.svg',images:['assets/gown.svg']},
{title:'Maroon Flow Dress',price:2250,old:2600,discount:'-13%',desc:'Graceful • Comfortable • Chic',cover:'assets/maroon.svg',images:['assets/maroon.svg']}
];
function ps(){try{let x=JSON.parse(localStorage.getItem('ufm_products'));return Array.isArray(x)&&x.length?x:demo}catch(e){return demo}}
function money(n){return '৳ '+Number(n||0).toLocaleString('en-BD')}
function render(list){let e=document.getElementById('products');e.innerHTML='';list.forEach((p,i)=>{let d=document.createElement('article');d.className='product';d.dataset.search=(p.title+' '+(p.desc||'')).toLowerCase();d.onclick=()=>openP(i);d.innerHTML='<div class="pimg"><img src="'+p.cover+'" alt="'+p.title+'"><span class="sale">'+(p.discount||'-10%')+'</span></div><div class="info"><div class="name">'+p.title+'</div><div class="price">'+money(p.price)+' <span class="old">'+(p.old?money(p.old):'')+'</span></div><button class="order" onclick="event.stopPropagation();order('+i+')">ORDER NOW</button></div>';e.appendChild(d)})}
function filterProducts(q){q=(q||'').toLowerCase().trim();let all=ps();render(q?all.filter(p=>(p.title+' '+(p.desc||'')).toLowerCase().includes(q)):all)}
function openP(i){let p=ps()[i];main.src=p.cover;mn.textContent=p.title;md.textContent=p.desc||'';mp.textContent=money(p.price);buy.onclick=()=>order(i);thumbs.innerHTML='';(p.images||[p.cover]).forEach(s=>{let x=document.createElement('img');x.src=s;x.onclick=()=>main.src=s;thumbs.appendChild(x)});modal.classList.add('open')}
function closeM(e){if(!e||e.target.id==='modal')modal.classList.remove('open')}
function order(i){let p=ps()[i],s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');let url=n?'https://wa.me/'+n+'?text='+encodeURIComponent('Assalamu Alaikum, I want to order: '+p.title+' - '+money(p.price)):'https://wa.me/';window.open(url,'_blank')}
function whatsapp(){let s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');window.open(n?'https://wa.me/'+n:'https://wa.me/','_blank')}
function toggleSearch(){document.getElementById('searchbar').classList.toggle('open');if(document.getElementById('searchbar').classList.contains('open'))setTimeout(()=>document.getElementById('searchInput').focus(),80)}
function openDrawer(){document.getElementById('drawer').classList.add('open')}
function closeDrawer(e){if(!e||e.target.id==='drawer')document.getElementById('drawer').classList.remove('open')}
function goCart(){alert('Your cart is ready. Add products from the collection to order on WhatsApp.')}
let s=JSON.parse(localStorage.getItem('ufm_settings')||'{}');if(s.whatsapp)document.getElementById('wa').textContent=s.whatsapp;render(ps());
</script>
</body>
</html>
