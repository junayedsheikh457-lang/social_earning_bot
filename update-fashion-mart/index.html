<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Update Fashion Mart</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}body{padding-bottom:82px;overflow-x:hidden}.wrap{width:100%;max-width:759px;margin:auto}.shot{position:relative;width:100%;line-height:0}.shot img{display:block;width:100%;height:auto}.hot{position:absolute;background:transparent;border:0;cursor:pointer}.menu{left:3%;top:7%;width:14%;height:43%}.search{right:15%;top:7%;width:13%;height:43%}.cart{right:1%;top:7%;width:13%;height:43%}.wa{left:20%;top:0;width:60%;height:100%}.cats{left:5%;bottom:0;width:90%;height:38%}.arrival{padding:30px 18px 20px}.title{display:flex;align-items:center;justify-content:center;gap:18px;font-size:30px;font-weight:900;line-height:1.05;margin:0 0 24px;text-align:center}.title:before,.title:after{content:"";height:2px;background:#111;width:74px}.products{display:grid;grid-template-columns:1fr 1fr;gap:14px}.product{border:1px solid #ddd;border-radius:15px;overflow:hidden;background:#fff}.product img{width:100%;height:230px;object-fit:cover;display:block}.info{padding:10px}.name{font-weight:800;font-size:14px}.price{font-size:17px;font-weight:900;margin-top:5px}.old{text-decoration:line-through;color:#888;font-size:12px}.order{width:100%;border:0;background:#10263c;color:#fff;padding:10px;border-radius:8px;margin-top:8px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;height:82px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);z-index:50;text-align:center}.bottom a{color:#222;text-decoration:none;font-weight:800;font-size:14px;padding-top:7px}.bi{display:block;font-size:29px;line-height:34px}.new{display:inline-block;background:#195184;color:#fff;border-radius:11px;padding:2px 9px;font-size:10px}.float{position:fixed;right:18px;bottom:96px;width:64px;height:64px;border-radius:50%;border:0;background:#20d366;color:#fff;font-size:34px;z-index:55}.drawer{display:none;position:fixed;inset:0;background:#0008;z-index:80}.drawer.open{display:block}.panel{width:285px;height:100%;background:#fff;padding:22px}.panel a{display:block;padding:16px 4px;border-bottom:1px solid #eee;color:#111;text-decoration:none;font-weight:700}.searchbox{display:none;position:fixed;top:0;left:0;right:0;background:#fff;padding:15px;z-index:70;border-bottom:1px solid #ddd}.searchbox.open{display:block}.searchbox input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}@media(min-width:700px){.bottom{width:759px;left:50%;right:auto;transform:translateX(-50%)}}</style></head><body><main class="wrap"><div class="shot"><img src="assets/reference-header.jpg" alt="Update Fashion Mart header"><button class="hot menu" onclick="openMenu()"></button><button class="hot search" onclick="openSearch()"></button><button class="hot cart" onclick="cart()"></button></div><div class="shot"><img src="assets/reference-hero.jpg" alt="Update Fashion Mart hero"></div><div class="shot"><img src="assets/reference-category.jpg" alt="WhatsApp and Shop By Category"><button class="hot wa" onclick="whatsapp()"></button><a class="hot cats" href="#arrival"></a></div><section class="arrival" id="arrival"><h2 class="title">NEW ARRIVAL<br>COLLECTIONS</h2><div class="products" id="products"></div></section></main><button class="float" onclick="whatsapp()">◔</button><nav class="bottom"><a href="#"><span class="bi">⌂</span>Home</a><a href="#arrival"><span class="bi">☆</span>Arrival <span class="new">NEW</span></a><a href="#" onclick="cart();return false"><span class="bi">🛒</span>Cart</a><a href="#" onclick="openSearch();return false"><span class="bi">⌕</span>Search</a><a href="admin.html"><span class="bi">♙</span>Account</a></nav><div class="drawer" id="drawer" onclick="closeMenu(event)"><div class="panel" onclick="event.stopPropagation()"><a href="#" onclick="closeMenu()">Home</a><a href="#arrival" onclick="closeMenu()">New Arrivals</a><a href="#" onclick="openSearch();closeMenu();return false">Search</a><a href="admin.html">Account / Admin</a><a href="#" onclick="whatsapp();return false">WhatsApp Order</a></div></div><div class="searchbox" id="searchbox"><input id="q" placeholder="Search collections..." oninput="filter(this.value)"></div><script>const demo=[{title:'Floral Premium Collection',price:1450,old:1700,img:'assets/floral.svg'},{title:'Classic White Elegant Gown',price:2850,old:3200,img:'assets/gown.svg'},{title:'Maroon Flow Dress',price:2250,old:2600,img:'assets/maroon.svg'}];function products(){try{const p=JSON.parse(localStorage.getItem('ufm_products'));return Array.isArray(p)&&p.length?p:demo}catch(e){return demo}}function money(n){return '৳ '+Number(n||0).toLocaleString('en-BD')}function render(a){productsBox.innerHTML=a.map((p,i)=>`<article class="product"><img src="${p.cover||p.img}" alt="${p.title}"><div class="info"><div class="name">${p.title}</div><div class="price">${money(p.price)} <span class="old">${p.old?money(p.old):''}</span></div><button class="order" onclick="order(${i})">ORDER NOW</button></div></article>`).join('')}function filter(q){q=q.toLowerCase();render(products().filter(p=>(p.title+' '+(p.desc||'')).toLowerCase().includes(q)))}function order(i){const p=products()[i],s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');window.open(n?'https://wa.me/'+n+'?text='+encodeURIComponent('I want to order: '+p.title+' - '+money(p.price)):'https://wa.me/','_blank')}function whatsapp(){const s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');window.open(n?'https://wa.me/'+n:'https://wa.me/','_blank')}function cart(){alert('Cart / order area')}function openMenu(){drawer.classList.add('open')}function closeMenu(e){if(!e||e.target.id==='drawer')drawer.classList.remove('open')}function openSearch(){searchbox.classList.toggle('open');if(searchbox.classList.contains('open'))setTimeout(()=>q.focus(),50)}const productsBox=document.getElementById('products');render(products())</script></body></html>
