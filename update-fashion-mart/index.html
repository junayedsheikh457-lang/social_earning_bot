<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Update Fashion Mart</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#191919;font-family:Arial,Helvetica,sans-serif}body{padding-bottom:76px}.header{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}.menu{font-size:35px;width:48px;line-height:1;cursor:pointer}.logo{width:125px;height:62px;object-fit:contain}.headicons{display:flex;align-items:center;gap:17px}.search{font-size:40px;line-height:1}.cart{font-size:31px;position:relative}.count{position:absolute;right:-6px;top:-5px;background:#111;color:#fff;width:21px;height:21px;border-radius:50%;font-size:11px;text-align:center;line-height:21px}
.hero{width:100%;height:auto;aspect-ratio:900/430;position:relative;overflow:hidden;background:#f4eee6}.hero>img{display:block;width:100%;height:100%;object-fit:cover}.heroText{position:absolute;left:0;right:0;bottom:15px;padding:0 22px;color:#fff;text-shadow:0 2px 7px #0008}.heroText b{display:block;font-size:22px;letter-spacing:.3px}.heroText span{display:block;font-size:12px;margin-top:4px;letter-spacing:.2px}
.whats{height:78px;background:#741337;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700}.whats .bubble{font-size:28px}.whats u{font-size:19px;font-weight:800}
.categorySec{background:#b58c9a;padding:17px 15px 9px}.title{color:#fff;text-align:center;font-size:25px;font-weight:800;margin:0 0 18px;display:flex;align-items:center;justify-content:center;gap:13px}.title:before,.title:after{content:"";height:2px;width:74px;background:#fff}.cats{display:grid;grid-template-columns:1fr 1fr;gap:13px}.cat{height:auto;aspect-ratio:1/1;border-radius:23px;overflow:hidden;background:#fff}.cat img{display:block;width:100%;height:100%;object-fit:cover}.dots{text-align:center;color:#fff;font-size:18px;letter-spacing:7px;margin-top:6px;height:23px}
.arrival{padding:38px 15px 15px}.blackTitle{display:flex;align-items:center;justify-content:center;gap:13px;text-align:center;font-size:28px;font-weight:900;line-height:1.02;margin:0 0 22px}.blackTitle:before,.blackTitle:after{content:"";height:2px;width:74px;background:#222}.products{display:grid;grid-template-columns:1fr 1fr;gap:13px}.product{border:1px solid #e8e8e8;border-radius:15px;overflow:hidden;background:#fff;cursor:pointer}.pimg{height:245px;position:relative;background:#f3f3f3}.pimg img{width:100%;height:100%;object-fit:cover}.sale{position:absolute;right:7px;top:7px;background:#f15d00;color:#fff;border-radius:9px;padding:8px;font-weight:800;font-size:13px}.pinfo{padding:10px}.pname{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pprice{font-size:17px;font-weight:900;margin-top:5px}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:4px}.order{width:100%;margin-top:9px;border:0;background:#111;color:#fff;padding:10px;border-radius:8px;font-weight:800}
.floatwa{position:fixed;right:15px;bottom:91px;width:72px;height:72px;border-radius:50%;background:#20d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;z-index:25;box-shadow:0 4px 16px #0003}.bottom{position:fixed;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;z-index:30}.bottom a{color:#222;text-decoration:none;font-weight:800;font-size:14px;padding-top:7px}.bi{display:block;font-size:28px;line-height:31px}.new{display:inline-block;background:#195184;color:#fff;border-radius:10px;padding:2px 8px;font-size:10px}
.drawer{position:fixed;inset:0;background:#0008;z-index:40;display:none}.drawer.open{display:block}.drawerBox{height:100%;width:82%;background:#fff;padding:23px}.drawerBox h2{color:#741337}.drawerBox a{display:block;color:#222;text-decoration:none;font-weight:700;padding:16px 0;border-bottom:1px solid #eee}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;padding:14px}.modal.open{display:flex}.modalBox{background:#fff;width:100%;max-height:90vh;border-radius:18px;overflow:auto;position:relative}.close{position:absolute;right:8px;top:8px;border:0;border-radius:50%;background:#fff;width:40px;height:40px;font-size:25px;z-index:2}.mainImg{width:100%;height:410px;object-fit:contain;background:#f5f5f5}.mi{padding:17px}.mi button{width:100%;margin-top:13px;border:0;border-radius:9px;background:#741337;color:#fff;padding:13px;font-weight:800}.thumbs{display:flex;gap:7px;overflow:auto;margin-top:12px}.thumbs img{width:67px;height:67px;object-fit:cover;border-radius:8px}
@media(min-width:700px){body{max-width:520px;margin:auto;box-shadow:0 0 30px #0001}.bottom{max-width:520px;left:50%;right:auto;width:520px;transform:translateX(-50%)}.floatwa{right:calc(50% - 245px)}}
</style></head><body>
<header class="header"><div class="menu" onclick="openDrawer()">☰</div><img class="logo" src="assets/logo.svg" alt="UFM"><div class="headicons"><div class="search">⌕</div><div class="cart">🛒<span class="count">0</span></div></div></header>
<section class="hero"><img src="assets/hero.svg" alt="Update Fashion Mart"><div class="heroText"><b>UPDATE FASHION MART</b><span>Where Elegance Meets Your Style</span></div></section>
<div class="whats"><span class="bubble">💬</span> WhatsApp: <u id="waTop">018XXXXXXXX</u></div>
<section class="categorySec"><h2 class="title">Shop By Category</h2><div class="cats"><div class="cat"><img src="assets/floral.svg"></div><div class="cat"><img src="assets/gown.svg"></div></div><div class="dots">● ● ●</div></section>
<section class="arrival" id="arrival"><h2 class="blackTitle">NEW ARRIVAL<br>COLLECTIONS</h2><div class="products" id="products"></div></section>
<div class="floatwa" onclick="whatsapp()">◔</div><nav class="bottom"><a href="#"><span class="bi">⌂</span>Home</a><a href="#arrival"><span class="bi">☆</span>Arrival <span class="new">NEW</span></a><a href="#"><span class="bi">🛒</span>Cart</a><a href="#"><span class="bi">⌕</span>Search</a><a href="#"><span class="bi">♙</span>Account</a></nav>
<div class="drawer" id="drawer" onclick="closeDrawer(event)"><div class="drawerBox" onclick="event.stopPropagation()"><h2>UPDATE FASHION MART</h2><a href="#">Home</a><a href="#arrival">New Arrival</a><a href="#">Categories</a><a href="#">Offers</a><a href="#">Contact</a></div></div>
<div class="modal" id="modal" onclick="closeModal(event)"><div class="modalBox" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button><img id="mainImg" class="mainImg"><div class="mi"><h2 id="mt"></h2><div id="md"></div><h3 id="mp"></h3><button id="modalOrder">ORDER ON WHATSAPP</button><div id="thumbs" class="thumbs"></div></div></div></div>
<script>
const demo=[{title:'Floral Premium Collection',price:1450,old:1700,discount:'-14%',desc:'Elegant floral fabric • Premium quality',cover:'assets/floral.svg',images:['assets/floral.svg']},{title:'White Elegant Gown',price:2850,old:3200,discount:'-11%',desc:'Premium • Flowing • Modest',cover:'assets/gown.svg',images:['assets/gown.svg']},{title:'Maroon Flow Dress',price:2250,old:2600,discount:'-13%',desc:'Graceful • Comfortable • Chic',cover:'assets/maroon.svg',images:['assets/maroon.svg']}];
function getProducts(){try{let x=JSON.parse(localStorage.getItem('ufm_products'));return Array.isArray(x)&&x.length?x:demo}catch(e){return demo}}function money(n){return '৳ '+Number(n||0).toLocaleString('en-BD')}
function render(){let e=document.getElementById('products');e.innerHTML='';getProducts().forEach((p,i)=>{let d=document.createElement('article');d.className='product';d.onclick=()=>openProduct(i);d.innerHTML='<div class="pimg"><img src="'+p.cover+'"><span class="sale">'+(p.discount||'-10%')+'</span></div><div class="pinfo"><div class="pname">'+p.title+'</div><div class="pprice">'+money(p.price)+' <span class="old">'+(p.old?money(p.old):'')+'</span></div><button class="order" onclick="event.stopPropagation();order('+i+')">ORDER NOW</button></div>';e.appendChild(d)})}
function openProduct(i){let p=getProducts()[i];document.getElementById('mainImg').src=p.cover;document.getElementById('mt').textContent=p.title;document.getElementById('md').textContent=p.desc||'';document.getElementById('mp').textContent=money(p.price);document.getElementById('modalOrder').onclick=()=>order(i);let t=document.getElementById('thumbs');t.innerHTML='';(p.images||[p.cover]).forEach(s=>{let im=document.createElement('img');im.src=s;im.onclick=()=>document.getElementById('mainImg').src=s;t.appendChild(im)});document.getElementById('modal').classList.add('open')}
function closeModal(e){if(!e||e.target.id==='modal')document.getElementById('modal').classList.remove('open')}function order(i){let p=getProducts()[i],s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');window.open(n?'https://wa.me/'+n+'?text='+encodeURIComponent('Assalamu Alaikum, I want to order: '+p.title+' - '+money(p.price)):'https://wa.me/','_blank')}function whatsapp(){let s=JSON.parse(localStorage.getItem('ufm_settings')||'{}'),n=(s.whatsapp||'').replace(/\D/g,'');window.open(n?'https://wa.me/'+n:'https://wa.me/','_blank')}function openDrawer(){document.getElementById('drawer').classList.add('open')}function closeDrawer(e){if(!e||e.target.id==='drawer')document.getElementById('drawer').classList.remove('open')}let s=JSON.parse(localStorage.getItem('ufm_settings')||'{}');if(s.whatsapp)document.getElementById('waTop').textContent=s.whatsapp;render();
</script></body></html>
